<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제시문 면접 대비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nanum+Myeongjo:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F2F4F7; --sheet:#FFFFFF; --ink:#1A1F2B; --sub:#4A5463; --rule:#DCE1E8; --rule2:#C9D0DA; --head:#F6F8FB;
  --navy:#15234A; --navy2:#1E3266; --on-navy:#FFFFFF;
  --primary:#2251D1; --primary-ink:#FFFFFF; --primary-soft:#EAF0FF;
  --point:#FFC93C; --point-ink:#1A1F2B;
  --mark:rgba(255,222,40,.55); --hint:#FFF7DD; --hint-ink:#5C4700; --answer:#F4F7FE;
  --ok:#178A50; --ok-soft:#E3F4EA; --warn:#C24B0C; --warn-soft:#FDEEE2; --red:#D2453B;
  --g:#2251D1; --g-soft:#EAF0FF; --c:#7B3FC4; --c-soft:#F2EAFC; --e:#4A5463; --e-soft:#EEF0F4;
  --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; --serif:"Nanum Myeongjo","Batang",serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1218; --sheet:#161B23; --ink:#E6EAF0; --sub:#A3ADBB; --rule:#2A323E; --rule2:#3A4452; --head:#1B212B;
    --navy:#0B1530; --navy2:#13224A; --on-navy:#FFFFFF;
    --primary:#7E9CFF; --primary-ink:#0E1218; --primary-soft:#1D2848;
    --point:#FFCF52; --point-ink:#1A1F2B;
    --mark:rgba(255,210,0,.32); --hint:#2A2412; --hint-ink:#F2D27A; --answer:#1A2131;
    --ok:#6FD3A0; --ok-soft:#13261C; --warn:#FF9A62; --warn-soft:#2E1A10; --red:#FF7A70;
    --g:#7E9CFF; --g-soft:#1D2848; --c:#C9A2F2; --c-soft:#2A1E3A; --e:#AEB7C4; --e-soft:#232A34; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1218; --sheet:#161B23; --ink:#E6EAF0; --sub:#A3ADBB; --rule:#2A323E; --rule2:#3A4452; --head:#1B212B;
  --navy:#0B1530; --navy2:#13224A; --on-navy:#FFFFFF;
  --primary:#7E9CFF; --primary-ink:#0E1218; --primary-soft:#1D2848;
  --point:#FFCF52; --point-ink:#1A1F2B;
  --mark:rgba(255,210,0,.32); --hint:#2A2412; --hint-ink:#F2D27A; --answer:#1A2131;
  --ok:#6FD3A0; --ok-soft:#13261C; --warn:#FF9A62; --warn-soft:#2E1A10; --red:#FF7A70;
  --g:#7E9CFF; --g-soft:#1D2848; --c:#C9A2F2; --c-soft:#2A1E3A; --e:#AEB7C4; --e-soft:#232A34; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--primary)}
button{font:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3,h4{margin:0}
.in{max-width:1200px;margin:0 auto;padding:0 16px}

/* 머리글 */
.hd{background:var(--sheet);padding-top:env(safe-area-inset-top,0px)}
.hd .in{display:flex;align-items:center;gap:20px;min-height:72px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mk{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--primary);color:var(--primary-ink);font-weight:900;font-size:15px;letter-spacing:-.02em}
.logo b{font-size:20px;font-weight:900;letter-spacing:-.03em}
.hsearch{margin-left:auto;display:flex;align-items:stretch;border:2px solid var(--primary);border-radius:24px;overflow:hidden;width:min(380px,100%);background:var(--sheet)}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px 16px;outline:none}
.hsearch button{border:0;background:var(--primary);color:var(--primary-ink);padding:0 16px;font-weight:700;cursor:pointer}
@media (max-width:640px){.hd .in{gap:10px;min-height:0}.hsearch{margin-left:0;width:100%}}
.gnb{background:var(--navy);position:sticky;top:0;z-index:30}
.gnb .in{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.gnb .in::-webkit-scrollbar{display:none}
.gnb a{color:var(--on-navy);text-decoration:none;font-weight:700;font-size:15.5px;padding:14px 22px;white-space:nowrap;border-bottom:3px solid transparent;opacity:.82}
.gnb a:hover{opacity:1;background:var(--navy2)}
.gnb a[aria-current="page"]{opacity:1;border-bottom-color:var(--point)}
@media (max-width:640px){.gnb a{padding:12px 10px;font-size:14.5px;flex:1;text-align:center}}

main{padding:22px 0 64px}
main .in{display:flex;flex-direction:column;gap:18px}

/* 공통 상자 */
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.box-h h2,.box-h h3{font-size:17px;font-weight:700}
.box-b{padding:16px 18px}
.more{font-size:13px;color:var(--sub);text-decoration:none;font-weight:500;white-space:nowrap}
.more:hover{color:var(--primary)}
.btn{appearance:none;border:1px solid var(--rule2);background:var(--sheet);color:var(--ink);border-radius:4px;padding:7px 13px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:700}
.btn.pri:hover{filter:brightness(1.08);color:var(--primary-ink)}
.btn.pt{background:var(--point);border-color:var(--point);color:var(--point-ink);font-weight:700}
.btn.pt:hover{filter:brightness(1.05);color:var(--point-ink)}
.btn.line{background:transparent;border-color:rgba(255,255,255,.55);color:var(--on-navy)}
.btn.line:hover{border-color:#fff;color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-block;font-size:12px;color:var(--sub);background:var(--e-soft);border-radius:3px;padding:1px 7px;margin:0 3px 3px 0}

/* 쪽 제목 */
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:12px;flex-wrap:wrap}
.ptitle h1{font-size:clamp(22px,3vw,28px);font-weight:900;letter-spacing:-.03em}
.crumb{font-size:13px;color:var(--sub)}
.crumb b{color:var(--ink);font-weight:500}

/* 홈 */
.main-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.main-top{grid-template-columns:minmax(0,1fr)}}
.banner{border-radius:6px;background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 55%,#2C4FA8 100%);color:var(--on-navy);padding:28px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:36px solid rgba(255,255,255,.06)}
.banner .lab{display:inline-block;align-self:flex-start;background:var(--point);color:var(--point-ink);font-weight:700;font-size:12.5px;border-radius:3px;padding:2px 9px}
.banner h1{font-size:clamp(24px,3.6vw,34px);font-weight:900;letter-spacing:-.03em;line-height:1.25}
.tsel{display:flex;gap:0;background:rgba(255,255,255,.12);border-radius:6px;padding:4px;align-self:flex-start;position:relative;z-index:1}
.tsel button{appearance:none;border:0;background:transparent;color:var(--on-navy);font-family:var(--mono);font-weight:600;font-size:18px;padding:8px 22px;border-radius:4px;cursor:pointer}
.tsel button[aria-pressed="true"]{background:#FFFFFF;color:#15234A}
.banner .go{align-self:flex-start;font-size:17px;padding:12px 28px;border-radius:4px;position:relative;z-index:1}
.my .box-b{display:flex;flex-direction:column;gap:14px}
.my .run{background:var(--warn-soft);border:1px solid var(--warn);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.my .run b{color:var(--warn)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.meter .top b{font-family:var(--mono);font-size:18px}
.bar{height:8px;border-radius:2px;background:var(--e-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.c i{background:var(--c)}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:6px 0}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;border-right:1px solid var(--rule)}
.quick a:last-child{border-right:0}
.quick a:hover .ic{background:var(--primary);color:var(--primary-ink)}
.quick .ic{width:52px;height:52px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;transition:background .15s}
@media (max-width:560px){.quick{grid-template-columns:repeat(5,minmax(0,1fr))}.quick a{border-right:0;font-size:12.5px;padding:10px 2px}.quick .ic{width:42px;height:42px}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.today .w{font-size:24px;font-weight:900;letter-spacing:-.02em}
.today .hj{font-family:var(--serif);color:var(--sub);font-size:15px;margin-left:6px}
.today p{margin:8px 0 0}
.ul{list-style:none;margin:0;padding:0}
.ul li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.ul li:last-child{border-bottom:0}
.ul .dt{font-family:var(--mono);font-size:13px;white-space:nowrap}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--head);font-weight:700;color:var(--ink);border-top:2px solid var(--ink);border-bottom:1px solid var(--rule2);padding:10px 8px;text-align:center;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--rule);padding:12px 8px;text-align:center;vertical-align:middle}
.tbl td.l{text-align:left}
.tbl .no{font-family:var(--mono);font-weight:600}
.tbl .cpt{font-weight:700}
.tbl .cpt.lock{font-weight:400;color:var(--sub)}
.st{font-size:12px;font-weight:700;border-radius:3px;padding:2px 8px;white-space:nowrap}
.st.done{color:var(--ok);background:var(--ok-soft)}
.st.todo{color:var(--sub);background:var(--e-soft)}
.st.live{color:var(--warn);background:var(--warn-soft)}
@media (max-width:720px){
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;border:1px solid var(--rule);border-top:2px solid var(--ink);border-radius:4px;margin-bottom:8px;padding:10px 12px;background:var(--sheet)}
  .tbl td{border:0;padding:0;text-align:left;display:block}
  .tbl td.mh{display:none}
  .tbl td.no{grid-column:1;grid-row:1}
  .tbl td.cpt{grid-column:2;grid-row:1}
  .tbl td.stc{grid-column:3;grid-row:1;text-align:right}
  .tbl td.f{grid-column:1/3;grid-row:2}
  .tbl td.act{grid-column:3;grid-row:2}
  .tbl td.act .row{justify-content:flex-end!important;flex-wrap:nowrap}
}
.tabs{display:flex;border-bottom:1px solid var(--rule2);gap:0;overflow-x:auto}
.tabs button{appearance:none;border:0;background:transparent;color:var(--sub);font-weight:700;font-size:15px;padding:10px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.tabs button .n{font-family:var(--mono);font-size:13px;margin-left:4px}

/* 모의면접 */
.exam-bar{position:sticky;top:51px;z-index:20;background:var(--navy);color:var(--on-navy);border-radius:6px;padding:10px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
@media (max-width:640px){.exam-bar{top:47px;grid-template-columns:auto 1fr auto;padding:8px 12px}}
.exam-bar .who{display:flex;flex-direction:column;line-height:1.3}
.exam-bar .who small{font-size:12px;opacity:.85}
.exam-bar .who b{font-size:17px}
.exam-bar .clock{font-family:var(--mono);font-weight:600;font-size:30px;letter-spacing:.03em;text-align:center;font-variant-numeric:tabular-nums}
.exam-bar .clock.low{color:var(--point)}
.exam-bar .clock.over{color:#FF8A80}
.exam-bar .acts{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:640px){.exam-bar .clock{font-size:22px}.exam-bar .who small{display:none}.exam-bar .acts .btn{padding:5px 9px;font-size:13px}}
.tbar{grid-column:1/-1;height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--point);transition:width .25s linear}
.tbar.over i{background:#FF8A80}
.overmsg{grid-column:1/-1;font-size:13px;font-weight:700;color:#FFB4AC}
.exam{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:minmax(0,1fr)}}
.paper .box-h{background:var(--head)}
.paper .box-b{padding-top:4px}
.passage{padding-block:16px;border-bottom:1px dashed var(--rule2);display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:4px}
.passage:last-child{border-bottom:0}
.plabel{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--primary)}
.ptext{font-family:var(--serif);font-size:15.5px;line-height:1.85;display:flex;flex-direction:column;gap:10px}
.ptext p{margin:0;overflow-wrap:anywhere}
.ptext mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.src{font-family:var(--sans);font-size:12.5px;color:var(--sub)}
.sheet-side{position:sticky;top:150px;max-height:calc(100vh - 168px);overflow:auto}
@media (max-width:900px){.sheet-side{position:static;max-height:none;overflow:visible}}
.qitem{border-bottom:1px solid var(--rule);padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.qitem:last-child{border-bottom:0}
.qhead{display:flex;gap:10px}
.qnum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;margin-top:1px}
.qtext{font-weight:500}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--rule2);border-radius:4px;padding:10px 12px;background:var(--sheet);color:var(--ink)}
textarea:focus{border-color:var(--primary);outline:none}
.saved{font-size:12px;color:var(--ok);margin-left:auto}
.hint{background:var(--hint);color:var(--hint-ink);border-radius:4px;padding:10px 12px;font-size:14px}
.ans{background:var(--answer);border-left:3px solid var(--primary);border-radius:4px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.ans p{margin:0}
.mine{background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.mine.empty{color:var(--sub)}

/* 결과 */
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink)}
.score div{padding:14px 10px;text-align:center;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.score div:last-child{border-right:0}
.score span{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.score b{font-family:var(--mono);font-size:20px}
@media (max-width:560px){.score{grid-template-columns:repeat(2,minmax(0,1fr))}.score div:nth-child(2){border-right:0}}
.cbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--primary-soft);border-radius:4px;padding:14px 18px}
.cbox .lab{background:var(--primary);color:var(--primary-ink);font-size:12.5px;font-weight:700;border-radius:3px;padding:2px 9px}
.cbox b{font-size:clamp(20px,3vw,26px);font-weight:900;letter-spacing:-.02em}
.newwords{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.newword{border:1px solid var(--c);background:var(--c-soft);border-radius:4px;padding:12px 14px}
.newword b{font-size:17px;color:var(--c)}
.newword p{margin:4px 0 0;font-size:14px}
.qres{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-bottom:1px solid var(--rule)}
.qres:last-child{border-bottom:0}
.qres h4{font-size:13px;color:var(--sub);font-weight:700}

/* 단어장 */
.note-box summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;font-weight:700;font-size:16px}
.note-box summary::-webkit-details-marker{display:none}
.note-box summary::after{content:"펼치기 +";font-size:13px;font-weight:500;color:var(--sub)}
.note-box[open] summary::after{content:"접기 −"}
.note-box[open] summary{border-bottom:1px solid var(--rule)}
.note-box .box-b p{margin:0 0 10px;max-width:80ch}
.note-box .box-b p:last-child{margin-bottom:0}
.fbar{display:flex;flex-direction:column;gap:12px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{appearance:none;border:1px solid var(--rule2);background:var(--sheet);color:var(--ink);border-radius:3px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.wsearch{display:flex;gap:6px;max-width:440px}
.wsearch input{flex:1;min-width:0;font:inherit;font-size:14px;border:1px solid var(--rule2);border-radius:4px;padding:8px 12px;background:var(--sheet);color:var(--ink)}
.wcount{font-size:14px}
.wcount b{color:var(--primary)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
@media (max-width:400px){.wgrid{grid-template-columns:minmax(0,1fr)}}
.wcard{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--e)}
.wcard.g{border-top-color:var(--g)}
.wcard.c{border-top-color:var(--c)}
.whead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.whead h3{font-size:20px;font-weight:900;letter-spacing:-.02em}
.whead .hj{font-family:var(--serif);color:var(--sub);font-size:14px}
.whead .badges{margin-left:auto;display:flex;gap:4px}
.badge{font-size:11.5px;font-weight:700;border-radius:3px;padding:1px 7px;white-space:nowrap}
.badge.g{color:var(--g);background:var(--g-soft)}
.badge.c{color:var(--c);background:var(--c-soft)}
.badge.e{color:var(--e);background:var(--e-soft)}
.badge.cat{color:var(--sub);background:var(--e-soft);font-weight:500}
.wcard .mean{margin:0}
.wcard dl{margin:0;display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:6px 10px;font-size:14px}
.wcard dt{color:var(--sub);font-weight:700;font-size:13px}
.wcard dd{margin:0}
.exam-note{font-size:13px;background:var(--g-soft);border-radius:4px;padding:8px 10px;margin:0}
.exam-note b{color:var(--g)}
.unv{display:inline-block;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:3px;padding:0 6px;margin-left:4px}
.okb{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:3px;padding:0 6px;margin-left:4px}

.dialog{background:var(--sheet);color:var(--ink);border-radius:6px;max-width:420px;width:100%;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}

.dialog .row{padding:0 18px 18px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ft{background:var(--sheet);border-top:1px solid var(--rule);padding:20px 0 calc(28px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--sub);line-height:1.7}
.ft p{margin:0 0 4px}
.ft b{color:var(--ink)}

<script>
const PASSAGES = {"K1": [{"src": "미카엘리스-멘텐 반응속도론", "url": "https://ko.wikipedia.org/wiki/%EB%AF%B8%EC%B9%B4%EC%97%98%EB%A6%AC%EC%8A%A4-%EB%A9%98%ED%85%90_%EB%B0%98%EC%9D%91%EC%86%8D%EB%8F%84%EB%A1%A0", "blocks": [{"t": "p", "x": "미카엘리스-멘텐 반응속도론(영어: Michaelis–Menten kinetics) 또는 미하엘리스-멘텐 반응속도론은 생화학에서 가장 잘 알려진 효소 반응속도론에 관한 모델 중 하나이다. 기질 농도에 따른 효소의 초기 반응속도의 그래프를 대수적으로 나타내는 방법이다."}, {"t": "p", "x": "기질의 농도가 낮을 때 기질의 농도에 비례하며, 기질의 농도가 과량일 때 일정한 한계 속도에 접근한다."}]}, {"src": "광합성", "url": "https://ko.wikipedia.org/wiki/%EA%B4%91%ED%95%A9%EC%84%B1", "blocks": [{"t": "p", "x": "20세기 초에 프레더릭 블랙만(Frederick Blackman)과 가브리엘 하워드(Gabrielle Matthaei)는 빛의 세기(방사조도)와 온도가 탄소 동화 속도에 미치는 영향을 조사했다."}, {"t": "p", "x": "온도가 일정할 때, 탄소 동화 속도는 빛의 세기에 따라 다르며, 빛의 세기가 증가함에 따라 광합성량이 증가하지만, 빛의 세기가 어느 정도 이상이 되면 광합성량은 더 이상 증가하지 않고 일정해진다."}]}, {"src": "로지스틱 함수", "url": "https://ko.wikipedia.org/wiki/%EB%A1%9C%EC%A7%80%EC%8A%A4%ED%8B%B1_%ED%95%A8%EC%88%98", "blocks": [{"t": "p", "x": "로지스트형 개체군 성장 모델(logistic model of population growth)는 개체군 생태학에서 개체군의 증가율을 설명하는 모델로 1838년 Verhulst가 고안해 냈다. 이 모델에 따르면 일정하지 않은 환경, 한정된 자원 내에서의 개체군 밀도가 증가함에 따라 자원 요구가 증가하게 되고 이는 개체당 출생률의 감소, 개체당 사망률의 증가를 가져오게되므로 개체군의 성장은 감소할 것임을 보여준다."}]}, {"src": "수확 체감", "url": "https://ko.wikipedia.org/wiki/%EC%88%98%ED%99%95_%EC%B2%B4%EA%B0%90", "blocks": [{"t": "p", "x": "특수한 상황에서는 한계수익이 증가하는 예가 있다. 팩시밀리는 단 1대만 홀로 있다면 아무 쓸모가 없지만, 2대가 있으면 메시지를 교환할 수 있고, 수량이 증가함에 따라 메시지 교환 경로는 많아진다. 그러나, 어느 정도 수준까지 팩시밀리가 널리 보급되고 나면, 교환 경로가 증가하여도 편의성은 별로 향상되지 않게 된다."}]}], "K2": [{"src": "뱅크런", "url": "https://ko.wikipedia.org/wiki/%EB%B1%85%ED%81%AC%EB%9F%B0", "blocks": [{"t": "p", "x": "뱅크런(영어: bank run)은 많은 고객이 가까운 시일 내에 은행이 파산할 수 있다고 믿기 때문에 은행에서 돈을 인출할 때 발생한다."}, {"t": "gap"}, {"t": "p", "x": "뱅크런이 진행됨에 따라 자기실현적 예언이 될 수 있다. 더 많은 사람이 현금을 인출할수록 채무 불이행 가능성이 높아지고, 이는 추가 인출을 유발한다. 이는 은행의 현금이 소진되어 갑작스러운 파산에 직면할 정도로 은행을 불안정하게 만들 수 있다."}]}, {"src": "혈액응고", "url": "https://ko.wikipedia.org/wiki/%ED%98%88%EC%95%A1%EC%9D%91%EA%B3%A0", "blocks": [{"t": "p", "x": "활성화된 혈소판은 저장된 과립의 내용물을 혈장으로 방출한다. 과립에는 ADP, 세로토닌, 혈소판 활성화 인자(PAF), 폰 빌레브란트 인자(vWF), 혈소판 인자 4, 그리고 트롬복산 A2(TXA2)가 포함되어 있으며, 이들은 다시 추가적인 혈소판을 활성화한다."}]}, {"src": "얼음-반사율 되먹임", "url": "https://ko.wikipedia.org/wiki/%EC%96%BC%EC%9D%8C-%EB%B0%98%EC%82%AC%EC%9C%A8_%EB%90%98%EB%A8%B9%EC%9E%84", "blocks": [{"t": "p", "x": "얼음은 반사율이 매우 높기 때문에 개활지나 다른 육지보다 훨씬 더 많은 태양 에너지를 우주로 다시 반사한다."}, {"t": "p", "x": "고위도 지역은 기온이 가장 낮기 때문에 다년생 눈 덮임, 광범위한 빙하 및 빙모가 존재할 가능성이 높으며, 심지어 빙상을 형성할 가능성도 있다. 그러나 온난화가 발생하면 높은 기온으로 인해 얼음으로 덮인 면적이 줄어들고, 더 많은 바다나 육지가 노출된다. 반사율이 감소함에 따라 더 많은 태양 에너지가 흡수되고, 이는 더 큰 온난화와 빙권의 반사 부분의 더 큰 손실로 이어진다. 반대로 기온이 낮아지면 얼음 덮임이 증가하여 반사율이 높아지고, 이는 더 큰 냉각 결과로 이어져 얼음 형성을 더욱 촉진한다."}]}, {"src": "마태 효과", "url": "https://ko.wikipedia.org/wiki/%EB%A7%88%ED%83%9C_%ED%9A%A8%EA%B3%BC", "blocks": [{"t": "p", "x": "마태 효과(馬太效果, Matthew effect)는 저명한 연구자가 지원금 등 더 많은 혜택을 얻고, 그렇지 못한 연구자가 혜택에서 배제되면서 두 연구자 사이에 격차가 심해지는 것을 일컫는 말이다."}, {"t": "gap"}, {"t": "p", "x": "케이트 스타노비치 Keith Stanovich는 이를 학생의 읽기 문제에 적용하였다. 읽기 능력이 떨어지는 학생들은 학교에서 진급하면서 점점 더 독해에 어려움을 겪고, 언어는 도구과목으로써 기능하기 때문에 다른 교과목에서도 교육과정이 추구하는 목표를 달성하기는 시간이 지나면 지날 수록 더욱 어려워지는 것이다."}]}, {"src": "등비수열", "url": "https://ko.wikipedia.org/wiki/%EB%93%B1%EB%B9%84%EC%88%98%EC%97%B4", "blocks": [{"t": "p", "x": "등비수열(等比數列, 문화어: 같은비수렬, 영어: geometric sequence) 또는 기하수열(幾何數列)은 각 항이 이전 항과 일정한 비를 가지는 수열이며, 각 항과 이전 항의 일정한 비율을 공비(共比, common ratio)라고 한다."}, {"t": "p", "x": "등비수열은(공비가 −1, 1, 0이 아닌경우) 등차수열과 같이 선형 변화를 보이는 것과 달리, 지수적 변화를 보인다."}]}], "K3": [{"src": "붉은 여왕 가설", "url": "https://ko.wikipedia.org/wiki/%EB%B6%89%EC%9D%80_%EC%97%AC%EC%99%95_%EA%B0%80%EC%84%A4", "blocks": [{"t": "p", "x": "앨리스는 당황하여 그녀와 주위를 둘러 보았다. ‘왜죠? 우리는 계속 이 나무 아래에 있잖아요! 모든 것이 그대로에요! '"}, {"t": "p", "x": "‘물론이지’ 여왕이 말했다. '그럼 어때야 하는데?'"}, {"t": "p", "x": "‘이런, 우리 나라에서는', 앨리스는 여전히 약간 헐떡거렸다. `우리가 한 것처럼 오랫동안 아주 빨리 달렸다면, 일반적으로 다른 곳으로 가있어야 하죠. '"}, {"t": "p", "x": "‘그곳은 아주 느린 나라구나!’여왕이 말했다. ‘이제, 여기 보다시피, 당신이 할 수 있는한 힘껏 달려야만 이곳에 겨우 머무를 수 있을뿐이야. 만약 너가 다른 곳으로 가고 싶다면 적어도 이보다 두 배는 더 빨리 달려야 하지! '"}]}, {"src": "공진화", "url": "https://ko.wikipedia.org/wiki/%EA%B3%B5%EC%A7%84%ED%99%94", "blocks": [{"t": "p", "x": "십자화과 식물의 글루코시놀레이트라는 피토케미컬은 곤충의 애벌레가 이를 섭취했을 때 생화학적 작용에 의해 체내에서 독성물질로 바뀌는 기전이 있다. 한편 이후 진화적으로 배추흰나비를 포함한 일부 곤충들은 글루코시놀레이트를 체내에서 무력화시키는 단백질효소를 유전적으로 개발해온것으로 알려졌다."}]}, {"src": "항생제 내성", "url": "https://ko.wikipedia.org/wiki/%ED%95%AD%EC%83%9D%EC%A0%9C_%EB%82%B4%EC%84%B1", "blocks": [{"t": "p", "x": "항생제 저항성의 주요 원인은 세균의 유전적 변이이다. 항생제의 필요와는 상관 없이 노출되는 시간이 많을수록 저항성이 발전할 위험이 커진다."}, {"t": "p", "x": "병원균에 대한 항생제의 작용은 환경적인 스트레스로 볼 수 있다. 이들 생존을 위해 변이하는 세균들은 살아남아 복제된다. 그리고는 그들의 자손에 이러한 특성을 전파하며, 결과적으로 완전한 저항성을 지닌 군집을 만들어낸다."}]}, {"src": "군비 경쟁", "url": "https://ko.wikipedia.org/wiki/%EA%B5%B0%EB%B9%84_%EA%B2%BD%EC%9F%81", "blocks": [{"t": "p", "x": "19세기 말, 영국과 독일 양국은 전함 건조를 두고 경쟁하였다. 세계 정책에 관여하게 된 독일은 영국에 필적하는 해군력을 가질 필요가 절대적이어서, 1898년과 1900년 갖가지 해군법을 제정하고, 해군의 군사력 확장에 노력했다. 영국도 이것을 묵과할 수 없어 이에 격심한 건함 경쟁이 시작되었다. 영국은 동양이나 지중해로부터 함대를 영·프 해협으로 증강하는 등, 대립이 심각해져 경쟁의 중지 교섭도 결렬되고 경쟁은 한층 격심해졌다."}]}, {"src": "안보 딜레마", "url": "https://ko.wikipedia.org/wiki/%EC%95%88%EB%B3%B4_%EB%94%9C%EB%A0%88%EB%A7%88", "blocks": [{"t": "p", "x": "안보 딜레마(Security dilemma), 안전보장 딜레마, 나선형 모델(spiral model)은 국제 관계에서 한 국가의 안보 증가(군사력 증가 등)가 다른 국가의 안보에 대한 두려움을 야기하는 경우이다."}, {"t": "gap"}, {"t": "p", "x": "안보 딜레마는 (1) 공격용 무기와 방어용 무기를 구별하기 어렵고 (2) 방어보다 공격이 유리한 상황에서 특히 심각하다."}]}, {"src": "죄수의 딜레마", "url": "https://ko.wikipedia.org/wiki/%EC%A3%84%EC%88%98%EC%9D%98_%EB%94%9C%EB%A0%88%EB%A7%88", "blocks": [{"t": "p", "x": "두 명의 사건 용의자가 체포되어 서로 다른 취조실에서 격리되어 심문을 받고 있다."}, {"t": "p", "x": "둘 중 하나가 배신하여 죄를 자백하면 자백한 사람은 즉시 풀어주고 나머지 한 명이 10년을 복역해야 한다."}, {"t": "p", "x": "둘 모두 서로를 배신하여 죄를 자백하면 둘 모두 5년을 복역한다."}, {"t": "p", "x": "둘 모두 죄를 자백하지 않으면 둘 모두 6개월을 복역한다."}, {"t": "p", "x": "참가자 입장에서는 상대방의 선택에 상관없이 자백을 하는 쪽이 언제나 이익이므로 합리적인 참가자라면 자백을 택한다. 결국 결과는 둘 모두 5년을 복역하는 것이고, 이는 둘 모두가 자백하지 않고 6개월을 복역하는 것보다 나쁜 결과가 된다."}]}], "K4": [{"src": "그네", "url": "https://namu.wiki/w/%EA%B7%B8%EB%84%A4", "blocks": [{"t": "p", "x": "다른 사람이 뒤에서 밀어주는 경우가 아니라면 그네를 앉은 상태로 발을 땅에 대고 뒤로 끝까지 갔다가 몇번 왔다갔다 하면 앉은 사람의 무게 때문에 금세 멈추게 된다."}, {"t": "p", "x": "땅에서 발을 뗀 후 그네가 올라가는 타이밍에 맞춰 하늘로 힘껏 발을 찬다."}, {"t": "p", "x": "처음에는 타이밍 잡기가 까다롭지만 숙달되면 어렵지 않게 혼자서 탈 수 있다."}], "site": "나무위키"}, {"src": "수신기", "url": "https://ko.wikipedia.org/wiki/%EC%88%98%EC%8B%A0%EA%B8%B0", "blocks": [{"t": "p", "x": "많은 송신기로부터 오는 전파가 서로 간섭하지 않고 동시에 공기 중을 통과하여 안테나에 수신된다. 수신기에서는 이들이 서로 다른 주파수를 가지고 있기 때문에 분리될 수 있다. 즉, 각 송신기의 전파는 서로 다른 속도로 진동한다. 원하는 무선 신호를 분리하기 위해 대역 통과 필터는 원하는 무선 송신의 주파수는 통과시키고 다른 모든 주파수의 신호는 차단한다."}, {"t": "p", "x": "동조: 특정 방송국을 선택하기 위해 라디오를 원하는 송신기의 주파수에 \"동조\"시킨다. 라디오에는 동조된 주파수를 보여주는 다이얼이나 디지털 디스플레이가 있다. 동조는 수신기의 통과 대역 주파수를 원하는 무선 송신기의 주파수로 조정하는 것이다."}]}, {"src": "자기공명영상", "url": "https://ko.wikipedia.org/wiki/%EC%9E%90%EA%B8%B0%EA%B3%B5%EB%AA%85%EC%98%81%EC%83%81", "blocks": [{"t": "p", "x": "물의 수소 원자의 원자핵인 양성자는 임의적 방향의 스핀을 가지고 있는데, 강력한 자기장(磁氣場)에 들어가면 수소 원자핵의 스핀 방향이 자기장의 방향을 따라 가지런히 놓이게 된다. 이 상태에서 수직의 방향을 가진 고주파의 전자기 펄스를 걸어주면 수소 원자핵은 전자파의 에너지를 흡수해 자기장의 반대방향으로 스핀을 바꾸게 된다. 그 다음 펄스를 끊으면 역방향 스핀을 가진 수소 원자핵은 원래 상태로 되돌아가는데, 이 때 약한 전자파를 방출한다."}]}, {"src": "전자레인지", "url": "https://ko.wikipedia.org/wiki/%EC%A0%84%EC%9E%90%EB%A0%88%EC%9D%B8%EC%A7%80", "blocks": [{"t": "p", "x": "물 분자는 수소와 산소 원자로 이루어져 있는데, 수소 원자 쪽이 양전하를 띠고 있고 산소 원자 쪽이 음전하를 띠고 있는 극성 분자이다. 음식물에 마이크로파를 쪼이면 이와 같은 극성 분자는 전자기파의 전기장이 양과 음으로 진동할 때 분자가 양과 음의 방향을 바꾸며 매우 빠르게 회전하여 전자기장을 따라 정렬한다. 분자의 회전에 의해 분자들이 서로 밀고 당기거나 충돌하는데 이러한 운동에너지가 음식물의 온도를 높이게 된다."}, {"t": "p", "x": "실제로 공업용 전자레인지의 경우 915 MHz에서 작동하기도 하며, 이 대역에서도 정상적으로 음식물이 가열된다."}]}], "K5": [{"src": "르 샤틀리에의 원리", "url": "https://ko.wikipedia.org/wiki/%EB%A5%B4_%EC%83%A4%ED%8B%80%EB%A6%AC%EC%97%90%EC%9D%98_%EC%9B%90%EB%A6%AC", "blocks": [{"t": "p", "x": "화학 평형에서 계(系)의 상태를 결정하는 변수인 온도ㆍ압력ㆍ성분 농도 따위의 조건을 바꾸면, 그 계는 완화시키는 방향으로 반응이 진행되어 새로운 평형 상태에 도달한다."}, {"t": "p", "x": "계의 부피를 변화시키는 것은, 반응물과 생성물들의 부분압력을 변화시키는 것이며, 그것은 평형 상태에 영향을 줄 수 있다. 부피의 감소로 인한 압력이 증가하면, 기체의 분자 수가 줄어드는 평형이 더 선호된다. 부피의 증가로 인한 압력이 감소하면, 기체의 분자 수가 증가하는 평형이 더 선호된다."}]}, {"src": "렌츠의 법칙", "url": "https://ko.wikipedia.org/wiki/%EB%A0%8C%EC%B8%A0%EC%9D%98_%EB%B2%95%EC%B9%99", "blocks": [{"t": "p", "x": "전기 회로에서 발생하는 유도 기전력은 폐회로를 통과하는 자속의 변화에 반하는 유도 자기장을 만드는 방향으로 발생한다. 예를 들어, 폐회로를 통과하는 자속이 감소할 경우 이를 증가시킬 수 있는 유도 자기장을 만들기 위해, 유도 전류가 그에 맞는 방향으로 흐르게 된다. 즉, 자석이 움직이는 것을 방해하는 방향으로 유도 전류가 흐른다."}]}, {"src": "항상성", "url": "https://ko.wikipedia.org/wiki/%ED%95%AD%EC%83%81%EC%84%B1", "blocks": [{"t": "p", "x": "체온을 감시하는 시상하부는 정상 체온인 36.5°C에서 조금만 벗어나도 감지할 수 있다. 체온이 올라가면 땀 분비를 촉진하는 내분비선에 신호를 보내 체온을 낮추고, 반대로 체온이 낮아지면 근육을 떨게 하는 신호를 보내 체온을 높인다."}, {"t": "p", "x": "공복 상태가 길어지는 경우 신체는 신진대사의 정도를 낮추어 신체 각 부분이 더 적은 에너지를 소모하도록 조절한다."}]}, {"src": "관성", "url": "https://ko.wikipedia.org/wiki/%EA%B4%80%EC%84%B1", "blocks": [{"t": "p", "x": "관성(慣性, 영어: inertia)은 물체가 밖의 힘을 받지 않는 한 정지 또는 등속도 운동의 상태를 지속하려는 성질. 보통 질량이 클수록 물체의 관성이 크다. 주로 버스 등이 출발할 때 정지해 있으려는 승객들이 뒤로 쏠리는 현상, 그리고 급정거할 때 계속 운동하려는 승객들이 앞으로 쏠리는 현상으로 설명된다."}, {"t": "gap"}, {"t": "p", "x": "관성(질량)은 뉴턴 역학에서 외부힘에 대해 저항하는 정도를 말한다."}]}], "K6": [{"src": "습지", "url": "https://ko.wikipedia.org/wiki/%EC%8A%B5%EC%A7%80", "blocks": [{"t": "p", "x": "비가 온 뒤 습지는 늘어난 유량의 여유 분을 저장하는 저수지 역할을 하며 늪지의 식물들은 물의 흐름을 지연시켜서 유량의 극심한 변화를 막아 홍수발생을 완화시키기는 역할도 한다. 자연습지는 댐이나 저수지, 관개시설을 줄이는 경제적인 효과가 있으며 습지의 물은 곧 생활용수나 농업용수 등으로 이용되고 있다."}]}, {"src": "해양성 기후", "url": "https://ko.wikipedia.org/wiki/%ED%95%B4%EC%96%91%EC%84%B1_%EA%B8%B0%ED%9B%84", "blocks": [{"t": "p", "x": "해양성 기후(oceanic climate) 또는 해양 기후(marine climate 또는 maritime climate)는 쾨펜의 기후 구분에서 Cfb로 표시되거나 트레와사 기후 구분에서 Do로 표시되는 온대 기후의 하위 유형이다. 일반적으로 대륙의 중위도 서해안에서 전형적으로 나타나며, (위도에 비해) 따뜻한 여름과 서늘하거나 온화한 겨울이 특징이다. 쾨펜의 체계에서는 연간 온도 범위가 비교적 좁고 극단적인 온도가 드물며, 트레와사의 체계에서는 온화한 겨울과 함께 평범한 생육 기간이 특징이다."}, {"t": "p", "x": "해양성 기후는 인접한 차가운 바다의 산물이며 그 반영이다."}]}, {"src": "외환보유고", "url": "https://ko.wikipedia.org/wiki/%EC%99%B8%ED%99%98%EB%B3%B4%EC%9C%A0%EA%B3%A0", "blocks": [{"t": "p", "x": "외환보유액은 특히 국제수지 위기와 같은 잠재적인 위기에 대비한 저축으로 사용된다."}, {"t": "p", "x": "고정환율제를 시행하는 중앙은행은 수요와 공급의 균형에 따라 통화 가치가 하락하거나 상승하는 상황에 직면할 수 있다. (수요가 증가하면 통화 가치가 상승하고, 감소하면 하락하는 경향이 있다.) 따라서 중앙은행은 고정환율제를 유지하기 위해 외환보유고를 사용해야 한다."}, {"t": "p", "x": "수요가 낮은 통화(약세 통화)를 방어하는 데 사용할 수 있는 외환보유액은 제한적이기 때문에 통화 위기나 평가절하가 발생할 수 있다."}]}, {"src": "혈액", "url": "https://ko.wikipedia.org/wiki/%ED%98%88%EC%95%A1", "blocks": [{"t": "p", "x": "혈장의 약 91%는 물이고 혈장 단백질은 혈장 가운데 약 7%를 차지한다. 일부 항체와 단백질 형태의 호르몬을 제외한 대부분의 혈장 단백질은 간에서 생성된다. 혈장 단백질은 수소 이온을 흡수하거나 배출할 수 있어 혈액의 pH를 7.4로 유지하는 역할을 한다."}]}], "K7": [{"src": "QWERTY 자판", "url": "https://ko.wikipedia.org/wiki/QWERTY_%EC%9E%90%ED%8C%90", "blocks": [{"t": "p", "x": "QWERTY 자판(쿼티 자판)은 영어 타자기나 컴퓨터 자판에서 가장 널리 쓰이는 자판 배열이다."}, {"t": "p", "x": "효율 면에서 드보락 자판에 비해 떨어진다는 평가가 있으나 가장 널리 쓰이는 영문 자판이며 이를 기초로 많은 독일어의 QWERTZ 자판, 프랑스어의 AZERTY 자판 같은 다른 언어를 위한 자판이 만들어졌다."}]}, {"src": "표준궤", "url": "https://ko.wikipedia.org/wiki/%ED%91%9C%EC%A4%80%EA%B6%A4", "blocks": [{"t": "p", "x": "초기의 영국 철도는 다양한 궤간이 존재하고 있었는데, 심지어 스티븐슨이 초기에 개발했던 맨체스터-리버풀간 철도조차 최초엔 1422mm(4피트 8인치)의 것이었다고 한다. 그러나 스티븐슨의 성공은 여러 기술자들이 그 궤간을 답습하게 하는 효과를 초래하여, 결과적으로 영국에서 가장 긴 연장을 가진 궤간으로 자리잡게 하였다."}]}, {"src": "VHS", "url": "https://ko.wikipedia.org/wiki/VHS", "blocks": [{"t": "p", "x": "가정용 비디오 방식(영어: Video Home System; VHS, 브이에이치에스)은 카세트를 이용하여 동영상을 기록하고 재생할 수 있도록 만들어진 표준 규격이다. 1970년대 중반부터 2000년대 초반까지 홈비디오의 표준으로 전성기를 구가하였다."}, {"t": "p", "x": "1970년대에 비디오 포맷 전쟁이 일어났다. 이 때 VHS와 함께 가장 높은 경쟁력을 보인 포멧이 베타맥스였으나, VHS는 베타맥스의 대중성 경쟁에서 승리하여 우위를 점하는데 성공했다. 1985년 베타맥스는 공식적으로 패배를 선언했으며 2002년 베타맥스 형식의 비디오테이프 생산이 중단됐다."}]}, {"src": "궤간", "url": "https://ko.wikipedia.org/wiki/%EA%B6%A4%EA%B0%84", "blocks": [{"t": "p", "x": "궤간이 다를 경우 열차의 운행이 곤란하다. 대개 이러한 경우, 궤간이 다른 두 노선의 접속역에서 환승 내지는 환적을 하는데, 이것은 여러모로 시간과 처리량 면에서 부적절한 경우가 많다. 따라서, 이를 해결하기 위해서는 시설 또는 차량의 개조가 필요하게 된다."}, {"t": "p", "x": "차량에 의한 방법은 크게 대차를 교환하는 방법과, 궤간 가변 열차를 사용하는 방법이 있다."}]}], "K8": [{"src": "이상기체", "url": "https://ko.wikipedia.org/wiki/%EC%9D%B4%EC%83%81%EA%B8%B0%EC%B2%B4", "blocks": [{"t": "p", "x": "이상기체(理想氣體, 영어: ideal gas)는 분자 자체의 부피와 분자 사이의 상호작용을 무시할 수 있다고 가정한 기체 모형이다. 이 모형에서 입자는 무작위로 움직이며, 충돌은 탄성 충돌로 취급한다."}, {"t": "p", "x": "그러나 높은 압력이나 낮은 온도, 액화점 근처에서는 분자의 부피와 인력·반발력이 중요해져 차이가 커진다."}]}, {"src": "질점", "url": "https://ko.wikipedia.org/wiki/%EC%A7%88%EC%A0%90", "blocks": [{"t": "p", "x": "질점(質點, material particle, material point, mass point / 집중질량 集中質量)은 어떤 물체, 혹은 물체의 일부분의 무게중심에 전체의 무게가 집중되어있다고 가정했을 때 무게가 존재하는 지점이다. 좀 더 간단하게는 무게값을 가지는 0차원상의 점이다. 역학적 계산을 보다 간편하게 처리하기 위해 활용되는 기본적인 개념이다."}]}, {"src": "완전 경쟁", "url": "https://ko.wikipedia.org/wiki/%EC%99%84%EC%A0%84_%EA%B2%BD%EC%9F%81", "blocks": [{"t": "p", "x": "완전 경쟁(完全競爭, Perfect competition)이란 경제학에서 말하는 이론적인 시장모형으로, 생산자와 소비자가 시장의 가격 결정에 아무런 영향을 미칠 수 없는 시장을 말한다. 완전경쟁시장은 경제적으로 봤을 때 효율성이 극대화되기 때문에 경제적 잉여가 최대인 상태이지만, 현실적으로는 존재할 수 없는 이론적인 모형이다."}, {"t": "gap"}, {"t": "p", "x": "완전한 정보: 모든 경제주체가 완전한 정보를 보유하고 있으므로 정보 비대칭성이 발생하지 않고, 일물일가의 법칙이 성립한다."}]}, {"src": "하디-바인베르크 원리", "url": "https://ko.wikipedia.org/wiki/%ED%95%98%EB%94%94-%EB%B0%94%EC%9D%B8%EB%B2%A0%EB%A5%B4%ED%81%AC_%EC%9B%90%EB%A6%AC", "blocks": [{"t": "p", "x": "하디-바인베르크 원리(영어: Hardy-Weinberg principle)는 세대가 바뀌어도 대립유전자의 종류와 빈도 및 유전자형 빈도가 변하지 않는 유전적 평형 상태에 있는 멘델 집단에서는 대를 거듭하여도 대립유전자의 빈도가 변하지 않고 일정하게 유지된다는 것이다."}, {"t": "gap"}, {"t": "p", "x": "하디-바인베르크 평형을 수학적으로 증명하기 위해 개체군 A의 유전자 풀에 우성유전자 A와 열성유전자 a가 있다고 가정한다."}]}, {"src": "집단 면역", "url": "https://ko.wikipedia.org/wiki/%EC%A7%91%EB%8B%A8_%EB%A9%B4%EC%97%AD", "blocks": [{"t": "p", "x": "대량 예방 접종과 포위 접종을 채택한 이후 집단 면역에 대한 복잡성이 높아졌다. 초창기에 제작된 전염병 확산 모델링은 현실에 존재하지 않는 모든 사람들이 잘 감염되고, 서로 혼재되어 전염병을 빠르게 확산할 수 있는 모델로 제작되어서 현실과는 약간 차이가 있었다. 이후 현실에서 집단 면역을 관찰하여 현 시점에 맞는 집단 면역 공식을 제작하였다."}]}], "K9": [{"src": "수렴 진화", "url": "https://namu.wiki/w/%EC%88%98%EB%A0%B4%20%EC%A7%84%ED%99%94", "blocks": [{"t": "p", "x": "어류인 청새치와 포유류인 에우리노델피스와 파충류인 에우리노사우루스는 강(綱) 단위에서 다르지만, 물속에서 살아가는 데 적합한 형질을 가진 개체들이 살아남아 자손을 많이 남기고 그렇지 못한 개체들은 도태되면서, 결과적으로 서로 친척마냥 비슷한 형태를 갖추게 되었다."}], "site": "나무위키"}, {"src": "반향 위치 측정", "url": "https://ko.wikipedia.org/wiki/%EB%B0%98%ED%96%A5_%EC%9C%84%EC%B9%98_%EC%B8%A1%EC%A0%95", "blocks": [{"t": "p", "x": "반향 위치 측정(反響位置測定), 반향 정위(反響定位) 또는 에콜로케이션(echolocation)은 동물이 자신의 입이나 콧구멍으로부터 음파를 발사해, 그 음파가 물체에 부딪쳐 되돌아오는 메아리를 듣고, 물체와 자기와의 거리를 측정하거나 그 물체의 형태 등을 구별하는 것을 말한다."}, {"t": "gap"}, {"t": "p", "x": "박쥐 외에 고래류도 반향정위를 이용한다."}]}, {"src": "하디-바인베르크 원리", "url": "https://ko.wikipedia.org/wiki/%ED%95%98%EB%94%94-%EB%B0%94%EC%9D%B8%EB%B2%A0%EB%A5%B4%ED%81%AC_%EC%9B%90%EB%A6%AC", "blocks": [{"t": "p", "x": "하디-바인베르크 원리(영어: Hardy-Weinberg principle)는 세대가 바뀌어도 대립유전자의 종류와 빈도 및 유전자형 빈도가 변하지 않는 유전적 평형 상태에 있는 멘델 집단에서는 대를 거듭하여도 대립유전자의 빈도가 변하지 않고 일정하게 유지된다는 것이다."}, {"t": "p", "x": "이 원리의 이름은 1908년에 서로 독립적으로 유전자 풀에 대한 원리를 이끌어낸 영국의 수학자인 고드프리 하디와 독일의 내과의사이자 생물학자인 빌헬름 바인베르크의 이름을 따서 명명되었다."}]}, {"src": "맥놀이", "url": "https://ko.wikipedia.org/wiki/%EB%A7%A5%EB%86%80%EC%9D%B4", "blocks": [{"t": "p", "x": "피아노 및 오르간 조율사들은 맥놀이를 세는 방법을 사용하여 특정 음정에서 특정 숫자를 목표로 한다."}, {"t": "gap"}, {"t": "p", "x": "아마추어 무선 애호가들은 간섭 맥놀이 수를 수동으로 줄여 원하는 반송파 주파수에 정확히 조율하는 것을 \"제로 비팅\" 또는 \"제로 비트\"라고 부르는데, 이는 음악가들이 사용하는 조율 과정과 근본적으로 동일하다."}]}], "K10": [{"src": "불확정성 원리", "url": "https://ko.wikipedia.org/wiki/%EB%B6%88%ED%99%95%EC%A0%95%EC%84%B1_%EC%9B%90%EB%A6%AC", "blocks": [{"t": "p", "x": "불확정성 원리는 양자역학에 대한 추가적인 가정이 아니고 양자역학의 통계적 해석으로부터 얻어진 근본적인 결과이다. 하이젠베르크의 불확정성 원리는 위치-운동량에 대한 불확정성 원리이며, 입자의 위치와 운동량을 동시에 정확히 측정할 수 없다는 것을 뜻한다. 위치가 정확하게 측정될수록 운동량의 퍼짐(또는 불확정도)은 커지게 되고 반대로 운동량이 정확하게 측정될수록 위치의 불확정도는 커지게 된다."}]}, {"src": "필립스 곡선", "url": "https://ko.wikipedia.org/wiki/%ED%95%84%EB%A6%BD%EC%8A%A4_%EA%B3%A1%EC%84%A0", "blocks": [{"t": "p", "x": "필립스 곡선(영어: Phillips curve)은 단기적으로 인플레이션율과 실업률 간에 상반관계(역의 상관관계)가 있음을 나타내는 곡선이다. 그래프의 세로축에 인플레이션율(물가상승률), 가로축에 실업률을 두면 우하향하는 곡선이 되는데, 이는 여러 나라의 시대별 자료에 대한 실증 연구를 통해 명목 임금상승률이 높을수록 실업률이 낮게 나타나는 반비례 관계임을 보여준다."}]}, {"src": "기회비용", "url": "https://ko.wikipedia.org/wiki/%EA%B8%B0%ED%9A%8C%EB%B9%84%EC%9A%A9", "blocks": [{"t": "p", "x": "기회비용(機會費用, 영어: opportunity cost, alternative cost)은 하나의 재화를 선택했을 때, 그로 인해 포기한 것들 중 가장 큰 것의 가치를 말한다."}, {"t": "gap"}, {"t": "p", "x": "예를 들면, 한 도시가 도시 소유의 빈 땅 위에 병원을 건축하기로 결정한다면, 그 기회 비용은 그 땅과 건설 자금을 이용해 행할 수 있었던 다른 사업을 의미한다. 그 병원을 건축하는 결정을 함으로써, 그 도시는 스포츠센터, 넓은 주차장 또는 도시의 채무를 탕감하기 위해 그 땅을 매각하는 것과 같은 기회를 상실한다."}]}, {"src": "르 샤틀리에의 원리", "url": "https://ko.wikipedia.org/wiki/%EB%A5%B4_%EC%83%A4%ED%8B%80%EB%A6%AC%EC%97%90%EC%9D%98_%EC%9B%90%EB%A6%AC", "blocks": [{"t": "p", "x": "발열 과정에서의 온도 변화."}, {"t": "p", "x": "N2 +3H2 ⇌ 2NH3"}, {"t": "p", "x": "만약 온도가 증가한다면, 르샤틀리에의 원리에 의해 온도를 낮추기 위해, 흡열반응인 역반응을 시켜, N2와 H2를 더 많이 생성할 것이다. 그래서 암모니아 공정 과정에서는 NH3를 많이 생산하기 위해 온도가 낮은 계에서 진행해야 하는데, 그러면 반응속도가 느려지기 때문에, 둘을 모두 고려한 온도에서 진행할 때 효율이 최대가 된다."}]}, {"src": "능동 소음 제어", "url": "https://ko.wikipedia.org/wiki/%EB%8A%A5%EB%8F%99_%EC%86%8C%EC%9D%8C_%EC%A0%9C%EC%96%B4", "blocks": [{"t": "p", "x": "능동 노이즈 캔슬링은 저주파에 가장 적합하다. 고주파의 경우 자유 공간 및 정적 구역 기술을 위한 간격 요구 사항이 감당하기 어려워진다. 음향 캐비티 및 덕트 기반 시스템에서는 주파수가 증가함에 따라 노드의 수가 급격히 늘어나 능동 소음 제어 기술을 관리하기 어렵게 만든다. 수동 처리는 고주파에서 더 효과적이며 능동 제어 없이도 종종 적절한 해결책을 제공한다."}]}, {"src": "산술-기하 평균 부등식", "url": "https://ko.wikipedia.org/wiki/%EC%82%B0%EC%88%A0-%EA%B8%B0%ED%95%98_%ED%8F%89%EA%B7%A0_%EB%B6%80%EB%93%B1%EC%8B%9D", "blocks": [{"t": "p", "x": "수학에서, 산술-기하 평균 부등식(算術幾何平均不等式, 영어: arithmetic–geometric mean inequality)은 산술 평균과 기하 평균 사이에 성립하는 부등식이다. 이에 따르면, 음이 아닌 실수들의 산술 평균은 항상 기하 평균보다 크거나 같다. 또한, 두 평균이 같을 필요충분조건은 모든 수가 같은 것이다."}]}], "K11": [{"src": "열전도", "url": "https://ko.wikipedia.org/wiki/%EC%97%B4%EC%A0%84%EB%8F%84", "blocks": [{"t": "p", "x": "열전도(熱傳導, thermal conduction)는 열이 고온 부분에서 저온 부분으로, 중간 물질을 통해서 이동하는 것을 말한다."}, {"t": "p", "x": "같은 굵기의 철과 구리 철사의 한쪽을 꼬아서 붙이고 거기에서 4cm 정도의 간격으로 파라핀을 사용해서 성냥개비를 세운다. 철사의 다른 쪽을 나무 토막에 고정시킨 다음 꼬아 붙인 부분을 알코올 램프로 가열한다. 시간이 지나감에 따라 불길에 가까운 쪽부터 파라핀은 녹고 성냥개비가 차례대로 떨어지기 시작한다. 이것은 열이 고온 부분에서 저온 부분으로 철사를 통하여 이동하는 것을 나타내고 있다."}]}, {"src": "삼투", "site": "나무위키", "url": "https://namu.wiki/w/%EC%82%BC%ED%88%AC", "blocks": [{"t": "p", "x": "적혈구를 농도가 진한 고장액(hypertonic)에 담가 놓으면 수분이 밖으로 빠져나가 쪼그라든다. 반대로 농도가 묽은 저장액(hypotonic)에 담가 놓으면 수분이 적혈구로 들어와 결국 터지는 용혈 현상이 일어난다. 따라서 용액을 혈관에 주사할 때는 반드시 등장액(isotonic)을 사용해야만 한다."}, {"t": "p", "x": "양서류가 바닷물에 입수하면 몸이 쪼그라들어 죽는다. 양서류 체내 농도보다 바닷물의 농도가 훨씬 높기 때문에 체내 수분 입자가 피부를 통해 전부 빠져나가기 때문이다."}]}, {"src": "브라운 운동", "site": "나무위키", "url": "https://namu.wiki/w/%EB%B8%8C%EB%9D%BC%EC%9A%B4%20%EC%9A%B4%EB%8F%99", "blocks": [{"t": "p", "x": "식물학자 로버트 브라운이 식물의 수정 과정에 대해 연구하다 수면 위의 꽃가루를 관찰하게 되었는데, 꽃가루가 수면 위에서 굉장히 불규칙적으로 움직이는 현상을 발견하며 '브라운 운동'이라는 명칭이 붙게 되었다."}, {"t": "p", "x": "꽃가루가 물 분자 등 물속 미소 입자들과 충돌해서 나타나는 현상이다."}, {"t": "p", "x": "선박과 같은 유체 내의 큰 물질도 브라운 운동을 하지만, 그 영향이 미미하여 무시가능한 수준이다."}]}, {"src": "유행", "site": "나무위키", "url": "https://namu.wiki/w/%EC%9C%A0%ED%96%89", "blocks": [{"t": "p", "x": "보통 남들이 하지 않는 신기(神奇)성 행동이 특정 개인이나 소수 집단에서 시작될 때 일반인들은 기존의 행동양식을 유지하면서 한편으로 이에 관심과 흥미를 주게 된다. 이 시점에서는 신기성 행동이 비유행성 행동이다. 그러다가 시간이 흐르면서 일부 사람들이 이를 수용하거나 모방하고 다시 이를 쫓는 추종자 집단이 생기면서 특정한 비유행적 행동은 보편성을 갖는 유행으로 전환되는 과정을 거친다."}, {"t": "p", "x": "상류층이 위계가 떨어지는 것들과 구별되기 위해 어떤 행동양식을 선택하면 중산층, 서민이 상류층에 대한 열망을 담아 상류층을 쫓게 되어 유행이 번지는 경우가 더러 있다."}]}], "K12": [{"src": "트랜지스터", "url": "https://ko.wikipedia.org/wiki/%ED%8A%B8%EB%9E%9C%EC%A7%80%EC%8A%A4%ED%84%B0", "blocks": [{"t": "p", "x": "트랜지스터는 1947년 미국의 벨 연구소에서 월터 브래튼, 윌리엄 쇼클리, 존 바딘이 처음 만들었다."}, {"t": "p", "x": "트랜지스터는 보통 입력단, 공통단 그리고 출력단으로 구성되어 있다. 입력단과 공통단 사이에 전압 (FET) 또는 전류(BJT)를 인가하면 공통단과 출력단 사이의 전기전도도가 증가하게 되고 이를 통해 그들 사이의 전류흐름을 제어하게 된다."}]}, {"src": "중합효소 연쇄 반응", "site": "위키백과", "url": "https://ko.wikipedia.org/wiki/%EC%A4%91%ED%95%A9%ED%9A%A8%EC%86%8C_%EC%97%B0%EC%87%84_%EB%B0%98%EC%9D%91", "blocks": [{"t": "p", "x": "PCR에는 일련의 세 개의 단계가 있고 30~40회 정도 반복된다. PCR의 첫 번째 단계는 DNA를 변성(Denaturation)시키는 것이다. 두 가닥의 DNA는 가열함으로써 분리시킬 수 있다. 분리된 각각의 DNA는 주형(Template)으로서 역할을 하게 된다."}, {"t": "p", "x": "PCR의 세 번째 단계는 신장(Elongation)단계이다. 이 단계에서 열에 강한 DNA 중합효소가 주형 DNA에서 새로운 DNA를 만들게 된다."}]}, {"src": "지레", "url": "https://ko.wikipedia.org/wiki/%EC%A7%80%EB%A0%88", "blocks": [{"t": "p", "x": "지레는 막대를 이용하여 힘을 전달하는 도구이며, 지렛대(문화어: 지레대)라고 불리기도 한다."}, {"t": "p", "x": "병따개가 대표적인 제2 종 지레로, 손잡이 부분을 위로 올리면 병뚜껑에는 큰 힘이 작용한다. 힘점이 작용점보다 받침점에서 더 멀기 때문에 힘점이 움직이는 거리는 작용점이 움직이는 거리보다 멀지만, 힘점에 가하는 힘보다 더 큰 힘이 작용점에 가해진다."}]}, {"src": "레버리지", "site": "나무위키", "url": "https://namu.wiki/w/%EB%A0%88%EB%B2%84%EB%A6%AC%EC%A7%80", "blocks": [{"t": "p", "x": "가용한 자산의 4배를 추가로 빌려서 10%의 수익을 올린다면, 자산이 50% 증가하는 것이기 때문에 투자에 성공하기만 한다면 빠르게 돈을 벌 수 있다."}, {"t": "p", "x": "주가가 하락만 해도 투자자들은 손해를 보는데 거기에 빚까지 떠안게 될 수도 있는 하이 리스크 하이 리턴 성향의 투자이다. 더 나아가서는 투자했던 원금보다도 갚아야 할 빚이 훨씬 더 많아질 수도 있는 무서운 투자이다."}]}], "K13": [{"src": "분업", "site": "나무위키", "url": "https://namu.wiki/w/%EB%B6%84%EC%97%85", "blocks": [{"t": "p", "x": "한명이 여러가지를 한번에 하는 것보다는 여러명이 하나의 일을 분담해서 전문적으로 할 경우 보통 생산성이 비약적으로 상승한다."}, {"t": "p", "x": "\"애덤 스미스 (Adam Smith)는 하루에 48,000 핀을 생산하는 10명의 남성을 고용하는 핀 공장을 방문했다. 스미스는 10명의 노동자가 매 단계마다 스스로 해낸다면, 그들은 각각 하루에 10~20개의 핀을 생산할 수 있다고 말한다. 따라서 핀 공장은 최대 4,800 핀 제조업체를 대체한다. 노동 생산성의 증가(하루 한 사람당 생산량)는 개별 핀 제조업체의 50배에 달했다.\""}]}, {"src": "줄기세포", "site": "나무위키", "url": "https://namu.wiki/w/%EC%A4%84%EA%B8%B0%EC%84%B8%ED%8F%AC", "blocks": [{"t": "p", "x": "줄기세포는 배아 발달 단계에서 필수적일 뿐만 아니라 성체의 신체에서도 중요하다. 성체의 몸은 노화나 손상으로 세포가 지속적으로 소실되기 때문에 새로운 세포의 공급이 필요하다. 예를 들어 골수의 조혈모세포는 끊임없이 분열하여 백혈구, 적혈구, 혈소판 등 혈구를 보충한다. 다만 조혈모세포는 이미 분화가 진행된 '성체 줄기세포'로, 혈구 계열로만 분화할 수 있다. 이는 수정란의 줄기세포가 갖는 광범위한 분화 능력과 달리 잠재력이 제한적이다. 쉽게 말해 어린이는 다양한 진로를 선택할 수 있지만, 이미 특정 분야 전문가가 된 성인은 완전히 다른 진로로 바꾸기 어렵다는 비유와 같다."}]}, {"src": "개미", "site": "나무위키", "url": "https://namu.wiki/w/%EA%B0%9C%EB%AF%B8", "blocks": [{"t": "p", "x": "개미를 비롯한 사회성 곤충의 계급은 인간이나 다른 포유류 무리의 상하수직적인 계급, 이른바 서열이 아니라 개미가 군집에서 맡는 역할에 불과하다. 대표적으로 여왕개미가 있는데, 여왕개미는 개미 사회에 군림하는 존재가 아니라 단지 산란을 담당하는 개미일 뿐이다. 즉 알을 낳기 위해 있는 존재에 지나지 않는다."}]}, {"src": "비교우위", "site": "나무위키", "url": "https://namu.wiki/w/%EB%B9%84%EA%B5%90%EC%9A%B0%EC%9C%84", "blocks": [{"t": "p", "x": "분식집 주인보다 라면을 잘 끓이는 축구선수라 할지라도 축구 시즌에는 축구에만 집중하고 라면은 분식집에서 사 먹는 편이 유리하다. 축구선수가 라면을 끓이는 데 소요되는 시간 동안 축구 경기를 통해 벌 수 있는 이익이 더 크기 때문이다. 이때 축구선수는 축구에 비교우위가 있다고 할 수 있다."}]}], "K14": [{"src": "조석", "url": "https://ko.wikipedia.org/wiki/%EC%A1%B0%EC%84%9D", "blocks": [{"t": "p", "x": "해수면이 가장 낮은 시기를 간조(干潮, 영어: low tide), 가장 높은 시기를 만조(滿潮, 영어: high tide)라 하며 간조에서 만조로 수위가 상승하는 동안을 밀물, 만조에서 간조로 수위가 하강하는 동안을 썰물이라고 한다. 만조와 간조 때의 해수면의 차이를 조차, 혹은 조수간만의 차라고 부른다."}, {"t": "p", "x": "남해안은 하루 두 번의 조석이 일어난다."}]}, {"src": "달의 위상", "url": "https://ko.wikipedia.org/wiki/%EB%8B%AC%EC%9D%98_%EC%9C%84%EC%83%81", "blocks": [{"t": "p", "x": "달이 차고 이지러지는 원리는 달이 스스로는 빛을 내지 않는 천체이기 때문에 태양에 비친 반구는 밝지만 반대쪽 반구는 암흑 상태가 되며, 그와 같은 달을 태양과 같은 쪽에서 바라보면 만월(滿月), 반대쪽에서 보면 신월(新月)이 되기 때문이다."}, {"t": "p", "x": "달이 공전함에 따라 신월에서 초승달이 되고, 상현(달은 첫 반달)에서 만월로 변한다. 만월이 약간 이지러진 것이 지새는 달이고, 그러고 나서 하현(나중에 뜨는 반달)을 거쳐 다시 초승달 모양으로 얇아져 다음 신월로 이어진다."}]}, {"src": "경기순환", "url": "https://ko.wikipedia.org/wiki/%EA%B2%BD%EA%B8%B0%EC%88%9C%ED%99%98", "blocks": [{"t": "p", "x": "클레망 주글러는 가격과 금융 연구에서 처음으로 경기의 순환 현상을 발견하였는데, 위기는 단지 반복되는 현상에 불과하다는 것을 증명함으로써 경기 변동 이론에 기여했다."}, {"t": "p", "x": "크누트 빅셀은 투자 회수율과 시장 이자율 간의 모순을 분석함으로써 경기 순환의 과정을 명확히 했다. 알버트 애프탈리온은 고정자본이 요구되는 장기간 특정 산업의 자료들에 대한 경기 순환의 의미들을 발전시켰다."}]}, {"src": "진자", "url": "https://ko.wikipedia.org/wiki/%EC%A7%84%EC%9E%90", "blocks": [{"t": "p", "x": "단진자는 실의 맨 끝에 추를 달아서 연직면 내에서 진동하게 만든 것이며, 중력에 의해 평형점을 중심으로 진동운동을 반복한다. 주로 진자 시계에 이용되었으며, 가속도계와 지진계 등의 과학 도구에 사용되고 있다."}]}], "K15": [{"src": "로렌츠 곡선", "url": "https://ko.wikipedia.org/wiki/%EB%A1%9C%EB%A0%8C%EC%B8%A0_%EA%B3%A1%EC%84%A0", "blocks": [{"t": "p", "x": "로렌츠 곡선은 소득 분배 정도를 나타낼 때 주로 이용된다. 가구의 누적 백분율은 x축에, 소득의 비율은 y축에 표시한다."}, {"t": "p", "x": "로렌츠 곡선 위에 있는 모든 점은 \"하위 x%의 가구는 총 소득의 y%를 얻는다\"로 표현할 수 있다. 절대적 평등의 상황에서는 x=y가 성립한다. 한편 한 사람이 모든 재산을 차지하는 절대적으로 불평등한 사회에서는 \"x\" < 100%일 때 y = 0%이고 x=100%일 때 y=100%으로 나타낼 수 있다."}]}, {"src": "인구 피라미드", "url": "https://ko.wikipedia.org/wiki/%EC%9D%B8%EA%B5%AC_%ED%94%BC%EB%9D%BC%EB%AF%B8%EB%93%9C", "blocks": [{"t": "p", "x": "연령별 인구와 남녀별 인구를 하나로 묶어서 이를 도형화(圖形化)하여 세로의 직선 좌우에 남녀를 나누고 낮은 연령층을 아래로 하여 나타내면, 연령이 증가할 때마다 일반적으로 인구는 적어지기 때문에 이 모양은 피라미드형(型)이 된다. 다만 인구의 연령구조는 출생률의 동향에 따라 달라지기 때문에 이 영향은 인구 피라미드에 나타나게 되어 몇 가지 형태가 생겨난다."}]}, {"src": "원자 궤도", "url": "https://ko.wikipedia.org/wiki/%EC%9B%90%EC%9E%90_%EA%B6%A4%EB%8F%84", "blocks": [{"t": "p", "x": "전자는 결코 한 점에 고정되어 있지 않지만, 한 점에서 전자와 상호작용할 확률은 전자의 파동 함수에서 찾을 수 있다."}, {"t": "p", "x": "더 많은 전자가 추가되면, 추가된 전자는 핵 주위의 공간을 더 고르게 채우는 경향이 있어 결과적으로(\"전자 구름\") 불확정성 원리 때문에 전자의 위치를 설명하는 전반적인 구형의 확률 영역을 형성하는 경향이 있다."}]}, {"src": "활성화 에너지", "url": "https://ko.wikipedia.org/wiki/%ED%99%9C%EC%84%B1%ED%99%94_%EC%97%90%EB%84%88%EC%A7%80", "blocks": [{"t": "p", "x": "화학반응이 진행되려면 입자의 유효충돌이 많아야 하고 입자 자체가 일정한 양 이상의 에너지를 가지고 있어야 하는데, 이 일정한 에너지가 바로 활성화 에너지이다."}, {"t": "p", "x": "활성화 에너지가 작으면 활성화 에너지보다 높은 에너지를 갖는 입자 수가 증가하여 반응 속도는 빨라지며, 활성화 에너지가 높다면 활성화 에너지 이상의 에너지를 갖는 입자가 줄어들어 반응 속도는 느려질 것이다."}]}], "K16": [{"src": "동화작용", "url": "https://ko.wikipedia.org/wiki/%EB%8F%99%ED%99%94%EC%9E%91%EC%9A%A9", "blocks": [{"t": "p", "x": "동화작용(영어: anabolism)은 더 작은 단위의 분자를 더 큰 단위의 분자로 합성하는 일련의 대사 경로이다. 합성대사(合成代謝)라고도 한다. 이러한 반응에는 에너지를 필요로 하며, 이는 에너지 흡수반응이다."}, {"t": "p", "x": "동화작용은 조직과 기관의 형성에 관여한다. 이러한 과정은 세포의 생장과 분화를 일으키고 복잡한 분자의 합성을 포함하는 과정으로 신체의 크기를 증가시킨다. 동화 과정의 예로는 뼈의 생장과 무기질화, 근육량의 증가가 있다."}]}, {"src": "핵융합", "url": "https://ko.wikipedia.org/wiki/%ED%95%B5%EC%9C%B5%ED%95%A9", "blocks": [{"t": "p", "x": "핵융합(核融合, 영어: nuclear fusion)은 물리학에서 핵분열과 상반되는 현상으로, 두 개의 원자핵이 부딪혀 새로운 하나의 무거운 원자핵으로 변환되는 반응이다."}, {"t": "p", "x": "원자핵을 서로 융합하게 하는 것은 아주 많은 에너지를 필요로 한다. 이는 가장 가벼운 원소인 수소에 대해서도 사실상 마찬가지이다. 하지만 가벼운 원소가 융합해서 무거운 원소 및 자유 중성자를 만들 때, 이 과정에서 발생하는 에너지는 융합하는 데 필요로 했던 에너지 이상이다."}]}, {"src": "핵분열", "url": "https://ko.wikipedia.org/wiki/%ED%95%B5%EB%B6%84%EC%97%B4", "blocks": [{"t": "p", "x": "핵분열(核分裂, 영어: nuclear fission, 문화어: 핵분렬)은 우라늄, 플루토늄 등과 같이 질량수가 큰 원자의 원자핵이 중성자와 충돌해 가벼운 원자핵 2개(핵분열 생성물)로 쪼개지는 핵반응의 한 유형이다."}, {"t": "p", "x": "핵분열 물질이 핵분열을 통해 가벼운 원자핵들로 쪼개지는 방법은 40가지 이상으로, 주로 질량수 90~100과 130~140에 속한 원자들에 집중된다. 이때 핵분열 전과 후의 질량이 보존되지 않아(질량 결손), 막대한 양의 에너지가 방출된다. 즉, 반응 전후의 질량이 감소하며 그 감소한 질량만큼의 에너지가 방출되는 것이다."}]}, {"src": "인수 합병", "url": "https://ko.wikipedia.org/wiki/%EC%9D%B8%EC%88%98_%ED%95%A9%EB%B3%91", "blocks": [{"t": "p", "x": "인수 합병(引受合倂, 영어: Merger and Acquisition, M&A)는 인수와 합병을 아울러 부르는 말이다. '인수'는 하나의 기업이 다른 기업의 경영권을 얻는 것이고, '합병'은 둘 이상의 기업들이 하나의 기업으로 합쳐지는 것이다."}, {"t": "p", "x": "회사는 합병을 통하여 경제적으로는 경영의 합리화, 영업비의 절감, 사업의 확장 등의 목적을 달성할 수 있으며, 법률적으로도 해산하는 회사의 청산절차의 생략, 재산의 이전에 따르는 세금의 경감 및 (특히 흡수합병의 경우)영업권 상실의 방지라는 이익을 얻을 수 있게 된다."}]}]};

const PUB = {"cats": ["관계", "변화", "균형·유지", "해결·선택", "질서·구조", "모형·논리"], "note": ["고려대 자연계열 제시문 면접에서 대학이 공개한 자료(선행학습 영향평가 보고서)로 확인한 공통 개념은 이중성, 임계점(2026), 대칭, 짝(2025), 유도, 선형·비선형(2024), 교환, 보강과 상쇄, 증가와 감소, 선별·선택, 효율(2022)입니다. 이 말들에는 공통점이 넷 있습니다.", "첫째, 이론이나 법칙의 이름이 아닙니다. 두 대상 사이의 관계(짝, 교환, 유도), 양이 변하는 모양(선형, 비선형, 임계점, 증가와 감소), 하나의 대상이 지닌 구조(대칭, 이중성, 보강과 상쇄), 문제를 푸는 방식(선택, 효율)을 가리킵니다.", "둘째, 수학·과학 용어이면서 사회에서도 쓰는 말입니다. 유도는 전자기 유도, 행동을 이끄는 정책, 식의 유도를 함께 뜻하고, 교환은 기체 교환, 다항식의 교환 법칙, 물물교환에 모두 쓰입니다. 이중성은 빛의 성질과 정보 사회의 양면성을, 임계점은 생태계의 회복 불가능한 시점과 사회의 전환점을 함께 설명합니다.", "셋째, 두 개념을 짝지어 묻는 경우가 많습니다. 2024학년도에는 선형과 비선형을 함께 찾고 둘 사이의 전환을 물었고, 2022학년도에는 보강과 상쇄, 증가와 감소의 차이를, 선택과 효율이 결합할 때의 사례를 물었습니다.", "넷째, 문항 흐름이 거의 같습니다. 1번에서 공통 개념을 찾고, 뒤 문항에서 그 개념으로 수학 문제(삼차방정식의 근, 무리함수와 역함수, 삼차함수 그래프), 자연현상, 사회 현상을 설명합니다. 문학(이상의 「거울」, 윤동주의 「별 헤는 밤」)이 제시문으로 나오기도 했습니다. 대학이 밝힌 채점 기준은 해당 개념 ‘혹은 이와 유사한 개념’을 논리적으로 설명하면 높은 점수를 준다는 것이므로, 정확한 단어보다 제시문을 꿰는 설명이 중요합니다.", "‘공식 답안 미확인’ 표시가 붙은 단어는 실제 기출 문항에서 뽑았지만 대학의 예시 답안을 확인하지 못한 것입니다. 제시문을 직접 읽고 붙인 개념이니 참고용으로만 보세요."], "gichul": [{"w": "이중성", "hj": "二重性", "cat": "질서·구조", "ok": true, "mean": "하나의 대상이 서로 다르거나 반대되는 두 성질을 함께 지니는 것입니다. 어느 쪽에서 보느냐에 따라 다른 모습이 드러납니다.", "sci": "빛은 이중 슬릿을 지날 때는 파동처럼, 광전 효과에서는 입자처럼 행동합니다. 함수와 역함수의 그래프는 직선 y = x를 거울로 삼아 서로 마주 봅니다.", "soc": "정보 기술이 편리함과 함께 감시, 정보 격차 같은 문제를 낳는 정보 사회의 양면성.", "pair": ["대칭", "상보성", "공존"], "exam": "2026 계열적합형 자연(오전) — 이상의 시 「거울」, 빛의 성질, 무리함수와 역함수, 정보 사회. 시에서 떠올린 단어로 빛을 설명하고, 그 단어를 역함수에 연결한 뒤 정보 사회의 문제까지 설명하는 문항."}, {"w": "임계점", "hj": "臨界點", "cat": "변화", "ok": true, "mean": "작은 변화가 쌓이다가 어느 값을 넘는 순간 상태가 크게 바뀌는 지점입니다. 그 지점을 지나면 원래대로 돌아가기 어려운 경우가 많습니다.", "sci": "생태계가 회복할 수 없는 상태로 넘어가는 시점, 전반사가 시작되는 임계각, 물의 상평형 그림의 경계, 그래프의 증가와 감소가 바뀌는 점.", "soc": "기존 이론을 뒤집는 과학 혁명, 다문화 사회로의 전환처럼 사회의 성격이 바뀌는 순간.", "pair": ["비선형", "평형"], "exam": "2026 계열적합형 자연(오후) — 회복 불가능한 시점에 이르는 생태계 변화, 기존 이론을 뒤집는 과학 발견, 다문화 사회로의 변화. 유사점을 한 단어로 표현해 삼차함수 그래프에 적용하는 문항. 대학 자문 의견은 ‘작은 변화가 큰 변화로 이어지는’ 공통 개념이라고 설명했습니다."}, {"w": "대칭", "hj": "對稱", "cat": "균형·유지", "ok": true, "mean": "점, 선, 면 같은 기준을 두고 양쪽의 모양이나 값이 같은 것입니다. 대칭이 깨지는 순간 새로운 성질이 생기기도 합니다.", "sci": "이산화 탄소는 직선형이라 결합의 극성이 서로 상쇄되어 무극성이고, 물은 굽은형이라 극성 분자입니다. y축에 대칭인 함수를 −a부터 a까지 적분하면 0부터 a까지 적분한 값의 두 배, 원점에 대칭인 함수는 0입니다. 해령 양쪽 암석의 나이와 고지자기 줄무늬도 대칭을 이룹니다.", "soc": "남아 선호로 인구 피라미드의 좌우 대칭이 무너지는 성비 불균형, 한쪽만 정보를 더 많이 아는 정보 비대칭.", "pair": ["이중성", "짝(쌍)"], "exam": "2025 계열적합형 자연(오전) — 분자의 극성, 항체의 구조, 함수와 적분, 해양저 확장설. 이어서 용수철의 탄성 퍼텐셜 에너지와 인구 구조를 설명하고, 대칭이 나타나는 자연현상의 원리를 묻는 문항."}, {"w": "짝(쌍)", "hj": "", "cat": "관계", "ok": true, "mean": "두 대상이 늘 짝으로 일어나거나 짝으로 존재해서 한쪽만 따로 있을 수 없는 관계입니다. 대학 자료는 이 개념을 ‘짝으로 일어나거나 존재함’이라고 적었습니다.", "sci": "작용과 반작용, 산화와 환원, DNA 염기의 A–T·G–C 결합, 변압기의 1차·2차 코일, 실수 계수 방정식의 켤레 허근, 자석의 N극과 S극.", "soc": "권리와 의무처럼 한쪽의 권리가 다른 쪽의 의무가 되는 관계.", "pair": ["교환", "공존", "대칭"], "exam": "2025 계열적합형 자연(오후) — 변압기, 산화·환원, DNA 이중 나선, 지구와 달의 만유인력. 이어서 실근이 하나인 삼차방정식의 나머지 근, 근로자의 권리와 의무를 설명하는 문항."}, {"w": "유도", "hj": "誘導", "cat": "변화", "ok": true, "mean": "한쪽의 변화가 다른 쪽에 새로운 변화를 끌어내는 것입니다. 수학에서는 이미 아는 사실에서 새 식이나 정리를 이끌어 내는 일도 유도라고 합니다.", "sci": "전자기 유도 법칙, 이웃 분자에 쌍극자를 만드는 유도 쌍극자, 신호 물질이 혈관을 넓히는 염증 반응, 롤의 정리에서 평균값 정리를 이끌어 내는 과정.", "soc": "출산 장려 정책, 국가 대표 성과 보상, 교통 법규 위반 벌금처럼 제도로 행동을 바꾸는 경우.", "pair": ["대우(명제)", "원인과 결과"], "exam": "2024 계열적합형 자연(오전) — 유도 법칙, 유도 쌍극자, 염증 반응, 평균값 정리. 판 구조론과 운동 제2법칙 설명, 사회 현상 찾기, 날씨와 붕어빵 대화의 추론을 따지는 문항. 대학은 비슷한 개념을 논리적으로 설명해도 좋게 평가했다고 밝혔습니다."}, {"w": "대우(명제)", "hj": "對偶", "cat": "모형·논리", "ok": true, "mean": "‘p이면 q이다’의 대우는 ‘q가 아니면 p가 아니다’입니다. 대우는 원래 명제와 참·거짓이 늘 같지만, 역(‘q이면 p’)과 이(‘p가 아니면 q가 아니다’)는 그렇지 않습니다.", "sci": "모든 정사각형은 직사각형이므로 직사각형이 아닌 도형은 정사각형도 아닙니다(대우). 그러나 정사각형이 아닌 도형이 직사각형이 아니라고는 말할 수 없습니다(이).", "soc": "‘추우면 붕어빵을 많이 먹는다’에서 ‘춥지 않으면 많이 먹지 않는다’는 바로 나오지 않습니다. 원인과 결과를 섞어 말하는 일상 대화의 오류를 짚을 때 씁니다.", "pair": ["유도", "상관과 인과"], "exam": "2024 계열적합형 자연(오전) 4번 — 날씨와 붕어빵 대화. 대학 해설은 추론이 논리적으로 잘못되었음을 설명하는 것이 핵심이며 명제의 대우가 관건이라고 밝혔습니다."}, {"w": "선형", "hj": "線形", "cat": "변화", "ok": true, "mean": "한 양이 변할 때 다른 양이 일정한 비율로 변하는 관계입니다. 그래프는 직선이고, 원인을 두 배로 <script>
const SECRET = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(SECRET_B64), c => c.charCodeAt(0))));
const SETS = SECRET.sets, CORE = SECRET.core;
const KEYS = Object.keys(PASSAGES);
const LABELS = ["가","나","다","라","마","바","사"];
const MINUTES = [7, 14, 21];
const TIER_NAME = {g:"기출", c:"핵심", e:"더 알아두기"};

/* 저장소 */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const J = {
  get(k,d){ try { const v = store.get(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k,v){ store.set(k, JSON.stringify(v)); }
};
const K_DONE = "kid2-done", K_MINS = "kid2-mins", K_RUN = "kid2-run", K_HIST = "kid2-hist";
const ansKey = (k,i) => `ans-${k}-${i}`;
let done = J.get(K_DONE, {});
let pickedMins = MINUTES.includes(+store.get(K_MINS)) ? +store.get(K_MINS) : 14;

/* 도우미 */
const $ = (s, el=document) => el.querySelector(s);
const app = document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function setNo(k){ return KEYS.indexOf(k) + 1; }
function fmt(ms){ const neg = ms < 0; ms = Math.abs(ms); const t = Math.floor(ms/1000); const m = Math.floor(t/60), s = t%60; return (neg ? "+" : "") + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"); }
function fmtSpent(ms){ const t = Math.max(0, Math.round(ms/1000)); const m = Math.floor(t/60), s = t%60; return m ? `${m}분 ${s}초` : `${s}초`; }
function fmtDate(t){ const d = new Date(t); return `${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; }
function unsolved(){ return KEYS.filter(k => !done[k]); }
function unlockedCore(){ return CORE.filter(w => done[w.set]); }
function allVisibleWords(){ return [...PUB.gichul.map(w => ({...w, tier:"g"})), ...unlockedCore().map(w => ({...w, tier:"c"})), ...PUB.extra.map(w => ({...w, tier:"e"}))]; }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function confirmBox(title, body, okText, onOk, cancelText="취소"){
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3><p>${body}</p><div class="row"><button class="btn" type="button" data-x="no">${esc(cancelText)}</button><button class="btn pri" type="button" data-x="ok">${esc(okText)}</button></div></div>`;
  m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ""; };
  m.querySelector('[data-x="no"]').onclick = close;
  m.querySelector('[data-x="ok"]').onclick = () => { close(); onOk(); };
  m.onclick = (e) => { if (e.target === m) close(); };
  m.querySelector('[data-x="ok"]').focus();
}
function setNav(name){ document.querySelectorAll(".gnb a").forEach(a => { if (a.dataset.nav === name) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); }); }
function pageTitle(title, crumb){ return `<div class="ptitle"><h1>${esc(title)}</h1><div class="crumb">홈 &gt; <b>${esc(crumb || title)}</b></div></div>`; }
const IC = {
  run: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
  sets: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  words: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/></svg>',
  gichul: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>',
  core: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0"/></svg>'
};

/* 진행 중인 면접 */
function getRun(){ return J.get(K_RUN, null); }
function leftMs(run){ return run.paused ? run.left : run.endAt - Date.now(); }
function startRun(k){
  const run = {k, mins: pickedMins, endAt: Date.now() + pickedMins*60000, paused:false, left:null, opened:[]};
  J.set(K_RUN, run); return run;
}
function goRun(k, replace){ if (replace) location.replace(`#/run/${k}`); else location.hash = `#/run/${k}`; }
function startRandom(replace){
  const cur = getRun();
  if (cur){ goRun(cur.k, replace); return; }
  let pool = unsolved(), again = false;
  if (!pool.length){ pool = KEYS.slice(); again = true; }
  const k = pool[Math.floor(Math.random()*pool.length)];
  startRun(k);
  goRun(k, replace);
  if (again) setTimeout(() => toast("모든 세트를 풀었습니다. 다시 풀 세트를 무작위로 골랐습니다."), 80);
}
function startSet(k){
  const cur = getRun();
  if (cur && cur.k !== k){
    confirmBox("진행 중인 모의면접이 있습니다", `세트 ${setNo(cur.k)}를 풀고 있습니다. 그만두고 세트 ${setNo(k)}를 시작할까요? 작성한 답안은 지워지지 않습니다.`, "새로 시작", () => { startRun(k); goRun(k); });
    return;
  }
  if (!cur) startRun(k);
  goRun(k);
}
function quitRun(after){
  confirmBox("모의면접을 그만둘까요?", "작성한 답안은 남아 있지만, 이 세트는 푼 것으로 기록되지 않습니다.", "그만두기", () => { store.del(K_RUN); after(); });
}

/* 홈 */
function viewHome(){
  setNav("home");
  const run = getRun();
  const nDone = Object.keys(done).length, nAll = KEYS.length;
  const nCore = unlockedCore().length, nCoreAll = CORE.length;
  const day = Math.floor(Date.now()/86400000);
  const offi = PUB.gichul.filter(w => w.ok);
  const today = offi[day % offi.length];
  const hist = J.get(K_HIST, []).slice(-5).reverse();
  app.innerHTML = `
  <section class="main-top">
    <div class="banner">
      <span class="lab">고려대 자연계열 제시문 면접</span>
      <h1>제시문 면접<br>실전 모의면접</h1>
      <div class="tsel" role="group" aria-label="제한 시간">
        ${MINUTES.map(m => `<button type="button" data-m="${m}" aria-pressed="${m===pickedMins}">${m}분</button>`).join("")}
      </div>
      <button class="btn pt go" type="button" id="go">${run ? "진행 중인 면접 이어서 풀기" : "모의면접 시작하기"}</button>
    </div>
    <aside class="box my">
      <div class="box-h"><h2>나의 학습</h2><a class="more" href="#/sets">세트 목록 +</a></div>
      <div class="box-b">
        ${run ? `<div class="run"><span><b>진행 중</b> 세트 ${setNo(run.k)} · ${run.mins}분 · ${leftMs(run) > 0 ? `남은 시간 ${fmt(leftMs(run))}` : `시간 초과 ${fmt(-leftMs(run))}`}${run.paused ? " · 일시정지" : ""}</span><span class="row"><a class="btn pri sm" href="#/run/${run.k}">이어서 풀기</a><button class="btn sm" type="button" id="quit">그만두기</button></span></div>` : ""}
        <div class="meter"><div class="top"><span>푼 세트</span><span><b>${nDone}</b> / ${nAll}</span></div><div class="bar"><i style="width:${nDone/nAll*100}%"></i></div></div>
        <div class="meter"><div class="top"><span>모은 핵심 단어</span><span><b>${nCore}</b> / ${nCoreAll}</span></div><div class="bar c"><i style="width:${nCore/nCoreAll*100}%"></i></div></div>
        <div class="meter"><div class="top"><span>단어장 단어</span><span><b>${allVisibleWords().length}</b> 개</span></div></div>
      </div>
    </aside>
  </section>
  <nav class="box quick" aria-label="바로가기">
    <a href="#/start"><span class="ic">${IC.run}</span>모의면접</a>
    <a href="#/sets"><span class="ic">${IC.sets}</span>세트 목록</a>
    <a href="#/words"><span class="ic">${IC.words}</span>단어장</a>
    <a href="#/words/g"><span class="ic">${IC.gichul}</span>기출 단어</a>
    <a href="#/words/c"><span class="ic">${IC.core}</span>핵심 단어</a>
  </nav>
  <section class="two">
    <div class="box today">
      <div class="box-h"><h3>오늘의 기출 단어</h3><a class="more" href="#/words/g">더보기 +</a></div>
      <div class="box-b">
        <div><span class="w">${esc(today.w)}</span>${today.hj ? `<span class="hj">${esc(today.hj)}</span>` : ""}</div>
        <p>${esc(today.mean)}</p>
        <p class="exam-note" style="margin-top:10px"><b>기출</b><span class="okb">대학 자료 확인</span> ${esc(today.exam)}</p>
      </div>
    </div>
    <div class="box">
      <div class="box-h"><h3>최근 학습</h3><a class="more" href="#/sets">더보기 +</a></div>
      <div class="box-b">
        ${hist.length ? `<ul class="ul">${hist.map(h => `<li><span>세트 ${setNo(h.k)} · <b>${esc(SETS[h.k].concept)}</b></span><span class="row"><span class="dt">${fmtDate(h.at)} · ${fmtSpent(h.spent)}</span><a class="btn sm" href="#/result/${h.k}">결과</a></span></li>`).join("")}</ul>` : `<p style="margin:0">기록 없음</p>`}
      </div>
    </div>
  </section>
  <section class="box">
    <div class="box-h"><h3>모의면접 세트</h3><a class="more" href="#/sets">전체 보기 +</a></div>
    <div class="box-b">${setsTable(KEYS.slice(0,5))}</div>
  </section>`;
  app.querySelectorAll(".tsel button").forEach(b => b.onclick = () => {
    pickedMins = +b.dataset.m; store.set(K_MINS, pickedMins);
    app.querySelectorAll(".tsel button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  $("#go").onclick = () => startRandom();
  const q = $("#quit"); if (q) q.onclick = () => quitRun(viewHome);
  bindStarts();
}
function bindStarts(){ app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startSet(b.dataset.start)); }
function setsTable(keys){
  const run = getRun();
  return `<table class="tbl">
    <thead><tr><th style="width:64px">번호</th><th>공통 개념</th><th>분야</th><th style="width:120px">구성</th><th style="width:80px">상태</th><th style="width:70px">풀이일</th><th style="width:170px">학습</th></tr></thead>
    <tbody>${keys.map(k => {
      const d = done[k], live = run && run.k === k;
      return `<tr>
        <td class="no" data-th="번호">${String(setNo(k)).padStart(2,"0")}</td>
        <td class="l cpt ${d?"":"lock"}" data-th="공통 개념">${d ? esc(SETS[k].concept) : "풀면 공개"}</td>
        <td class="l f ${d?"":"cpt lock"}" data-th="분야">${d ? `<span>${FIELDS[k].map(f => `<span class="tag">${esc(f)}</span>`).join("")}</span>` : "풀면 공개"}</td>
        <td class="mh" data-th="구성">제시문 ${PASSAGES[k].length} · 문항 ${SETS[k].qa.length}</td>
        <td class="stc" data-th="상태"><span class="st ${live?"live":d?"done":"todo"}">${live ? "푸는 중" : d ? "완료" : "미응시"}</span></td>
        <td class="mh" data-th="풀이일">${d ? fmtDate(d.at) : "-"}</td>
        <td class="act"><span class="row" style="justify-content:center">${d ? `<a class="btn sm" href="#/result/${k}">해설</a>` : ""}<button class="btn sm ${d?"":"pri"}" type="button" data-start="${k}">${live ? "이어 풀기" : d ? "다시 풀기" : "풀기"}</button></span></td>
      </tr>`;
    }).join("")}</tbody></table>`;
}

/* 세트 목록 */
let setTab = "all";
function viewSets(){
  setNav("sets");
  const n = {all: KEYS.length, todo: unsolved().length, done: KEYS.length - unsolved().length};
  const keys = KEYS.filter(k => setTab === "all" || (setTab === "done") === !!done[k]);
  app.innerHTML = `
  ${pageTitle("세트 목록")}
  <div class="tabs" role="tablist">
    ${[["all","전체"],["todo","미응시"],["done","완료"]].map(([v,t]) => `<button role="tab" type="button" data-tab="${v}" aria-selected="${setTab===v}">${t}<span class="n">${n[v]}</span></button>`).join("")}
  </div>
  <section>${keys.length ? setsTable(keys) : `<div class="empty-state">해당하는 세트가 없습니다.</div>`}</section>
  <div class="row" style="justify-content:space-between">
    <span class="row">제한 시간 ${MINUTES.map(m => `<button class="btn sm ${m===pickedMins?"on":""}" type="button" data-m="${m}">${m}분</button>`).join("")}</span>
    <button class="btn sm" type="button" id="reset">학습 기록 지우기</button>
  </div>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { setTab = b.dataset.tab; viewSets(); });
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { pickedMins = +b.dataset.m; store.set(K_MINS, pickedMins); viewSets(); });
  bindStarts();
  $("#reset").onclick = () => confirmBox("학습 기록을 모두 지울까요?", "푼 세트, 모은 핵심 단어, 작성한 답안이 모두 지워집니다. 되돌릴 수 없습니다.", "모두 지우기", () => {
    KEYS.forEach(k => SETS[k].qa.forEach((_,i) => store.del(ansKey(k,i))));
    store.del(K_DONE); store.del(K_RUN); store.del(K_HIST); done = {};
    toast("학습 기록을 지웠습니다."); viewSets();
  });
}

/* 제시문 */
function passagesHtml(k, withSrc){
  return PASSAGES[k].map((p,i) => {
    const body = p.blocks.map(b => b.t === "h" ? `<p><b>${esc(b.x)}</b></p>` : b.t === "gap" ? "" : `<p>${esc(b.x)}</p>`).join("");
    return `<article class="passage"><div class="plabel">(${LABELS[i]})</div><div class="ptext">${body}${withSrc ? `<div class="src">출처: <a href="${p.url}" target="_blank" rel="noopener">${esc(p.site || "위키백과")} 「${esc(p.src)}」</a></div>` : ""}</div></article>`;
  }).join("");
}

/* 모의면접 */
let tick = null, hlOn = false;
function viewRun(k){
  setNav("run");
  if (!PASSAGES[k]){ location.hash = "#/"; return; }
  let run = getRun();
  if (!run){ run = startRun(k); }
  else if (run.k !== k){ goRun(run.k, true); return; }
  const S = SETS[k];
  app.innerHTML = `
  <div class="exam-bar">
    <div class="who"><small>모의면접 · 제한 ${run.mins}분</small><b>세트 ${setNo(k)}</b></div>
    <div class="clock" id="clock">--:--</div>
    <div class="acts"><button class="btn line" type="button" id="pause">일시정지</button><button class="btn pt" type="button" id="submit">답안 제출</button></div>
    <div class="tbar" id="tbar"><i style="width:100%"></i></div>
    <div class="overmsg" id="overmsg" hidden>제한 시간이 지났습니다. 답안을 정리해 제출하세요.</div>
  </div>
  <div class="exam">
    <section class="box paper" aria-label="제시문">
      <div class="box-h"><h2>제시문</h2><span class="row"><button class="btn sm" id="hlBtn" type="button">형광펜</button><button class="btn sm" id="hlClear" type="button">지우기</button></span></div>
      <div class="box-b" id="passages">${passagesHtml(k, false)}</div>
    </section>
    <aside class="box paper sheet-side" aria-label="답안지">
      <div class="box-h"><h2>답안지</h2><span class="crumb">문항 ${S.qa.length}개</span></div>
      <div id="qs"></div>
    </aside>
  </div>`;
  const qs = $("#qs");
  S.qa.forEach((q,i) => {
    const el = document.createElement("div");
    el.className = "qitem";
    el.innerHTML = `<div class="qhead"><span class="qnum">${i+1}</span><div class="qtext">${esc(q.q)}</div></div>
      <textarea aria-label="${i+1}번 답안" placeholder="${i+1}번 답안"></textarea>
      <div class="row"><button class="btn sm" type="button" data-act="hint">힌트</button><span class="saved"></span></div>
      <div class="slot-h"></div>`;
    const ta = el.querySelector("textarea"), saved = el.querySelector(".saved");
    ta.value = store.get(ansKey(k,i)) || "";
    let t; ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { store.set(ansKey(k,i), ta.value); saved.textContent = "저장됨"; }, 400); });
    const hb = el.querySelector('[data-act="hint"]'), slot = el.querySelector(".slot-h");
    const showHint = () => { slot.innerHTML = `<div class="hint">${esc(q.hint)}</div>`; hb.textContent = "힌트 닫기"; hb.classList.add("on"); };
    if (run.opened.includes(i)) showHint();
    hb.onclick = () => {
      if (slot.firstChild){ slot.innerHTML = ""; hb.textContent = "힌트"; hb.classList.remove("on"); return; }
      const r = getRun();
      if (r && !r.opened.includes(i)){ r.opened.push(i); J.set(K_RUN, r); }
      showHint();
    };
    qs.appendChild(el);
  });
  hlOn = false;
  const hlBtn = $("#hlBtn");
  hlBtn.onclick = () => { hlOn = !hlOn; hlBtn.classList.toggle("on", hlOn); hlBtn.textContent = hlOn ? "형광펜 켜짐" : "형광펜"; };
  $("#hlClear").onclick = () => { $("#passages").innerHTML = passagesHtml(k, false); };
  const mark = () => {
    if (!hlOn) return;
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    const r = sel.getRangeAt(0);
    const p = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
    if (!p.closest(".ptext")) { sel.removeAllRanges(); return; }
    try { const m = document.createElement("mark"); m.appendChild(r.extractContents()); r.insertNode(m); } catch(e) {}
    sel.removeAllRanges();
  };
  $("#passages").addEventListener("mouseup", mark);
  $("#passages").addEventListener("touchend", () => setTimeout(mark, 30));
  const pause = $("#pause"), clock = $("#clock"), bar = $("#tbar"), over = $("#overmsg");
  const draw = () => {
    const r = getRun(); if (!r) return;
    const L = leftMs(r), total = r.mins*60000;
    clock.textContent = fmt(L);
    clock.classList.toggle("low", L > 0 && L <= 60000);
    clock.classList.toggle("over", L <= 0);
    bar.classList.toggle("over", L <= 0);
    bar.firstElementChild.style.width = (L > 0 ? L/total*100 : 100) + "%";
    over.hidden = L > 0;
    pause.textContent = r.paused ? "계속하기" : "일시정지";
  };
  clearInterval(tick); tick = setInterval(draw, 250); draw();
  pause.onclick = () => {
    const r = getRun(); if (!r) return;
    if (r.paused){ r.paused = false; r.endAt = Date.now() + r.left; r.left = null; }
    else { r.paused = true; r.left = r.endAt - Date.now(); }
    J.set(K_RUN, r); draw();
  };
  $("#submit").onclick = () => {
    app.querySelectorAll(".qitem textarea").forEach((ta,i) => store.set(ansKey(k,i), ta.value));
    const emptyNow = S.qa.filter((_,i) => !(store.get(ansKey(k,i)) || "").trim()).length;
    confirmBox("답안을 제출할까요?", (emptyNow ? `비어 있는 문항이 ${emptyNow}개 있습니다. ` : "") + "제출하면 해설과 공통 개념이 공개되고, 이 세트의 핵심 단어가 단어장에 들어갑니다.", "제출", () => finish(k));
  };
}
function finish(k){
  const r = getRun(); if (!r || r.k !== k) return;
  clearInterval(tick);
  const L = leftMs(r), spent = r.mins*60000 - L;
  const chars = SETS[k].qa.reduce((a,_,i) => a + (store.get(ansKey(k,i)) || "").replace(/\s/g,"").length, 0);
  const first = !done[k];
  done[k] = {at: Date.now(), mins: r.mins, spent, hints: r.opened.length, chars, over: L < 0};
  J.set(K_DONE, done);
  const hist = J.get(K_HIST, []); hist.push({k, at: Date.now(), spent}); J.set(K_HIST, hist.slice(-50));
  store.del(K_RUN);
  location.replace(`#/result/${k}` + (first ? "/new" : ""));
}

/* 결과 */
function viewResult(k, isNew){
  setNav("sets");
  const d = done[k];
  if (!d || !SETS[k]){ location.hash = "#/sets"; return; }
  const S = SETS[k];
  const words = CORE.filter(w => w.set === k);
  app.innerHTML = `
  ${pageTitle(`세트 ${setNo(k)} 결과`, "학습 결과")}
  <section class="box">
    <div class="box-b" style="display:flex;flex-direction:column;gap:14px">
      <div class="cbox"><span class="lab">공통 개념</span><b>${esc(S.concept)}</b></div>
      <div class="score">
        <div><span>제한 시간</span><b>${d.mins}분</b></div>
        <div><span>걸린 시간</span><b>${fmtSpent(d.spent)}</b>${d.over ? `<span style="color:var(--red);margin:4px 0 0">시간 초과</span>` : ""}</div>
        <div><span>작성 글자 수</span><b>${d.chars}자</b></div>
        <div><span>힌트 사용</span><b>${d.hints}회</b></div>
      </div>
      <div class="row">
        <button class="btn pri" type="button" id="next">${unsolved().length ? "다음 세트 풀기" : "무작위로 다시 풀기"}</button>
        <a class="btn" href="#/words/c">핵심 단어 보기</a>
        <a class="btn" href="#/sets">세트 목록</a>
      </div>
    </div>
  </section>
  <section class="box">
    <div class="box-h"><h2>${isNew ? "단어장에 추가된 핵심 단어" : "이 세트의 핵심 단어"}</h2><a class="more" href="#/words/c">단어장 +</a></div>
    <div class="box-b"><div class="newwords">${words.map(w => `<div class="newword"><b>${esc(w.w)}</b><p>${esc(w.mean)}</p></div>`).join("")}</div></div>
  </section>
  <section class="box">
    <div class="box-h"><h2>문항별 해설</h2><button class="btn sm" type="button" id="showP">제시문 보기</button></div>
    <div id="pbox" class="box-b" hidden style="border-bottom:1px solid var(--rule)">${passagesHtml(k, true)}</div>
    ${S.qa.map((q,i) => {
      const mine = (store.get(ansKey(k,i)) || "").trim();
      return `<div class="qres">
        <div class="qhead"><span class="qnum">${i+1}</span><div class="qtext">${esc(q.q)}</div></div>
        <h4>내 답안</h4>
        <div class="mine ${mine ? "" : "empty"}">${mine ? esc(mine) : "작성하지 않음"}</div>
        <h4>해설</h4>
        <div class="ans">${q.ans.map(a => `<p>${a}</p>`).join("")}</div>
      </div>`;
    }).join("")}
  </section>`;
  $("#next").onclick = () => startRandom();
  $("#showP").onclick = (e) => { const b = $("#pbox"); b.hidden = !b.hidden; e.currentTarget.textContent = b.hidden ? "제시문 보기" : "제시문 접기"; };
  if (isNew) toast(`단어장에 핵심 단어 ${words.length}개가 추가되었습니다.`);
}

/* 단어장 */
const wf = {tier:"all", cat:"all", q:""};
function viewWords(){
  setNav("words");
  const vis = allVisibleWords();
  const lockedN = CORE.length - unlockedCore().length;
  const counts = {all: vis.length, g: PUB.gichul.length, c: unlockedCore().length, e: PUB.extra.length};
  app.innerHTML = `
  ${pageTitle("단어장")}
  <details class="box note-box" ${matchMedia("(min-width:700px)").matches ? "open" : ""}>
    <summary>기출 단어 분석</summary>
    <div class="box-b">${PUB.note.map(p => `<p>${esc(p)}</p>`).join("")}</div>
  </details>
  <div class="tabs" role="tablist">
    ${[["all","전체"],["g","기출"],["c","핵심"],["e","더 알아두기"]].map(([v,n]) => `<button role="tab" type="button" data-tier="${v}" aria-selected="${wf.tier===v}">${n}<span class="n">${counts[v]}</span></button>`).join("")}
  </div>
  <section class="fbar">
    <div class="cats" role="group" aria-label="분류">
      ${["all", ...PUB.cats].map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="${wf.cat===c}">${c==="all"?"전체 분류":esc(c)}</button>`).join("")}
    </div>
    <form class="wsearch" id="wform"><input id="wq" type="search" placeholder="단어나 예시로 찾기" value="${esc(wf.q)}" aria-label="단어 찾기"><button class="btn pri" type="submit">검색</button></form>
    <div class="wcount" id="wcount"></div>
  </section>
  <section class="wgrid" id="wgrid"></section>`;
  app.querySelectorAll("[data-tier]").forEach(b => b.onclick = () => { wf.tier = b.dataset.tier; app.querySelectorAll("[data-tier]").forEach(x => x.setAttribute("aria-selected", x === b)); drawWords(); });
  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { wf.cat = b.dataset.cat; app.querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === b)); drawWords(); });
  $("#wq").addEventListener("input", (e) => { wf.q = e.target.value; drawWords(); });
  $("#wform").onsubmit = (e) => { e.preventDefault(); wf.q = $("#wq").value; drawWords(); };
  drawWords();

  function drawWords(){
    const names = new Set(vis.map(w => w.w));
    const q = wf.q.trim().toLowerCase();
    const list = vis.filter(w => (wf.tier === "all" || w.tier === wf.tier) && (wf.cat === "all" || w.cat === wf.cat) &&
      (!q || [w.w, w.hj, w.mean, w.sci, w.soc, w.exam || "", (w.pair||[]).join(" ")].join(" ").toLowerCase().includes(q)));
    list.sort((a,b) => (b.w === wf.q.trim()) - (a.w === wf.q.trim()));
    const showLocked = lockedN > 0 && (wf.tier === "all" || wf.tier === "c") && !q;
    $("#wcount").innerHTML = `검색 결과 <b>${list.length}</b>개`;
    const grid = $("#wgrid");
    grid.innerHTML = (showLocked ? `<div class="locked-card"><b>${lockedN}</b><span>열리지 않은 핵심 단어</span><button class="btn pri sm" type="button" id="goRun" style="align-self:flex-start">모의면접 시작하기</button></div>` : "")
      + (list.length ? list.map(w => card(w, names)).join("") : (showLocked ? "" : `<div class="empty-state">조건에 맞는 단어가 없습니다.</div>`));
    const g = $("#goRun"); if (g) g.onclick = () => startRandom();
    grid.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { wf.q = b.dataset.goto; wf.tier = "all"; wf.cat = "all"; viewWords(); window.scrollTo({top:0, behavior:"smooth"}); });
  }
  function card(w, names){
    const pair = (w.pair || []).map(p => names.has(p) ? `<button class="linkchip" type="button" data-goto="${esc(p)}">${esc(p)}</button>` : `<span class="plainchip">${esc(p)}</span>`).join("");
    return `<article class="wcard ${w.tier}">
      <div class="whead"><h3>${esc(w.w)}</h3>${w.hj ? `<span class="hj">${esc(w.hj)}</span>` : ""}<span class="badges"><span class="badge ${w.tier}">${TIER_NAME[w.tier]}</span><span class="badge cat">${esc(w.cat)}</span></span></div>
      <p class="mean">${esc(w.mean)}</p>
      <dl><dt>과학·수학</dt><dd>${esc(w.sci)}</dd><dt>사회</dt><dd>${esc(w.soc)}</dd>${pair ? `<dt>함께 볼 말</dt><dd>${pair}</dd>` : ""}</dl>
      ${w.exam ? `<p class="exam-note"><b>기출</b>${w.ok ? '<span class="okb">대학 자료 확인</span>' : '<span class="unv">공식 답안 미확인</span>'} ${esc(w.exam)}</p>` : ""}
      ${w.set ? `<p style="margin:0;font-size:13px">세트 ${setNo(w.set)}에서 얻은 단어 · <a href="#/result/${w.set}">해설 보기</a></p>` : ""}
    </article>`;
  }
}

/* 머리글 검색 */
document.getElementById("hsearch").onsubmit = (e) => {
  e.preventDefault();
  wf.q = document.getElementById("hq").value.trim(); wf.tier = "all"; wf.cat = "all";
  if (location.hash === "#/words") route(); else location.hash = "#/words";
};

/* 라우터 */
function route(){
  clearInterval(tick);
  document.getElementById("modal").hidden = true;
  document.getElementById("toast").classList.remove("show");
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const [page, arg, extra] = parts;
  if (page === "start"){ startRandom(true); return; }
  if (page === "run" && arg) viewRun(arg);
  else if (page === "result" && arg) viewResult(arg, extra === "new");
  else if (page === "sets") viewSets();
  else if (page === "words"){ if (arg && ["g","c","e"].includes(arg)){ wf.tier = arg; wf.cat = "all"; wf.q = ""; } viewWords(); }
  else viewHome();
  window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
